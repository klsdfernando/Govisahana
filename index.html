    .bg-ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(800px circle at var(--parallax-x, 50%) var(--parallax-y, 30%), var(--ambient-primary), transparent 60%),
        radial-gradient(600px circle at calc(100% - var(--parallax-x, 50%)) calc(100% - var(--parallax-y, 50%)), var(--ambient-secondary), transparent 50%);
      transition: background 0.4s ease;
    }

    /* Glassmorphic 3D Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, background-color 0.4s;
    }

    .glass-card:hover {
      border-color: rgba(76, 175, 80, 0.5);
    }

    /* Dynamic Cursor Spotlight Radial Glow */
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--spotlight-glow), transparent 40%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }
    .glass-card:hover::before {
      opacity: 1;
    }

    /* Glass Header */
    .glass-nav {
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);

      document.documentElement.style.setProperty('--parallax-y', `${py}%`);
    });
  </script>

    // --- REUSABLE 3D TILT BENTO CARD WRAPPER ---
    function BentoTiltCard({ children, className = "" }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`glass-card p-6 rounded-3xl ${className}`}
        >
          {children}
        </div>
      );
    }

    // --- LOGIN PAGE ---
    function LoginPage({ setActiveView, onLoginSuccess, currentLanguage, themeMode }) {
      const isDark = themeMode === 'dark';
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [role, setRole] = useState('farmer');
      const [email, setEmail] = useState('');
      const [otpStep, setOtpStep] = useState(false);
      const [enteredOtp, setEnteredOtp] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [resendTimer, setResendTimer] = useState(0);

      // Countdown timer for resend
      React.useEffect(() => {
        if (resendTimer > 0) {
          const t = setTimeout(() => setResendTimer(r => r - 1), 1000);
          return () => clearTimeout(t);
        }
      }, [resendTimer]);

      const handleSendOtp = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
          setEnteredOtp(data.devCode || '');
          setOtpStep(true);
          setResendTimer(60);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          // Verify OTP
          const verifyRes = await fetch(`${API_BASE}/api/otp/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code: enteredOtp })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyData.error || 'Invalid OTP');

          // Login / get user
          const loginRes = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, role })
          });
          const loginData = await loginRes.json();
          onLoginSuccess(loginData.user || { name: 'User', email, role });
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResend = async () => {
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to resend OTP');
          setResendTimer(60);
          setEnteredOtp(data.devCode || '');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })

          const data = await res.json();

          setEnteredOtp(data.devCode || '');

                {filtered.length === 0 ? (
                  <div className="text-center py-12 p-6 rounded-2xl border border-dashed border-slate-300 dark:border-amber-500/30 bg-slate-50/50 dark:bg-emerald-950/10">
                    <svg className="w-12 h-12 mx-auto text-amber-500 mb-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <p className="font-bold text-base opacity-80 mb-1">No Farmer Queries Match Your Filter</p>
                    <p className="text-xs opacity-60 max-w-sm mx-auto">Try clearing search keywords or selecting a different district filter.</p>
                  </div>
                ) : (
                  filtered.map(c => (
                    <div 
                      key={c.id} 
                      className={`p-5 rounded-2xl border transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-5 hover:border-amber-500/50 hover:shadow-md group ${
                        themeMode === 'light' ? 'border-slate-200 bg-white/80' : 'border-emerald-500/20 bg-emerald-950/30'
                      }`}
                    >
                      <div className="flex items-start gap-4">
                        <img 
                          src={c.sampleImage} 
                          alt="Farmer crop request" 
                          className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border border-slate-300 dark:border-emerald-500/30 shadow-md group-hover:scale-105 transition-transform duration-300 shrink-0" 
                        />
                        <div className="space-y-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className={`text-[11px] font-bold bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/30 flex items-center gap-1 ${
                              themeMode === 'light' ? 'text-amber-800' : 'text-amber-300'
                            }`}>
                              <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                              {c.farmerDistrict}
                            </span>
                            <span className={`text-xs font-bold bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/30 ${
                              themeMode === 'light' ? 'text-emerald-800' : 'text-emerald-300'
                            }`}>
                              {c.cropLabel}
                            </span>
                            <span className={`text-xs font-mono opacity-70 px-2 py-0.5 rounded ${
                              themeMode === 'light' ? 'bg-slate-200 text-slate-700' : 'bg-emerald-900/40 text-emerald-300'
                            }`}>
                              {c.ticketId}
                            </span>
                          </div>
                          <h3 className={`font-extrabold text-base sm:text-lg transition-colors ${ themeMode === 'light' ? 'group-hover:text-amber-700' : 'group-hover:text-amber-400' }`}>
                            {c.title}
                          </h3>
                          <p className="text-xs opacity-75 font-medium">
                            Farmer: <strong className="font-extrabold">{c.farmerName}</strong> â€¢ Status: <span className={`font-bold ${ themeMode === 'light' ? 'text-amber-700' : 'text-amber-400' }`}>{c.status}</span>
                          </p>
                        </div>
                      </div>

                      <button
                        onClick={() => { onSelectConsultation(c.id); setActiveView('consultation_room'); }}
                        className="px-5 py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 shrink-0 group-hover:bg-amber-500"
                      >
                        <span>{t.btnOpenChat}</span>
                        <svg className="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                      </button>
                    </div>
                  ))
                )}
              </div>
            </BentoTiltCard>
          </div>
        </div>
      );
    }

    // --- USER PROFILE MODAL ---
    function UserProfileModal({ isOpen, onClose, currentUser, onLogout }) {
      if (!isOpen || !currentUser) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn no-print">
          <BentoTiltCard className="w-full max-w-md !p-0 overflow-hidden shadow-2xl">
            <div className="bg-gradient-to-r from-emerald-900 to-emerald-800 p-6 text-white text-center border-b border-emerald-700 relative">
              <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-emerald-950 text-white font-bold text-sm">âœ•</button>
              <div className="w-16 h-16 rounded-full bg-emerald-600 text-white flex items-center justify-center text-2xl font-black mx-auto mb-2 border-2 border-white shadow-lg">
                {currentUser.name ? currentUser.name[0] : 'U'}
              </div>
              <h3 className="text-xl font-black text-white">{currentUser.name}</h3>
              <p className="text-xs text-emerald-200 capitalize font-bold">{currentUser.role} Account â€¢ {currentUser.district} District</p>
            </div>

            <div className="p-6 space-y-4">
              <div className="space-y-2 text-xs">
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">Mobile Phone:</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.phone}</span>
                </div>
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">District / Location:</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.district}</span>
                </div>
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">{currentUser.role === 'farmer' ? 'Primary Crop:' : 'Institution / Department:'}</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.cropOrDept || 'N/A'}</span>
                </div>
              </div>

              <button
                onClick={() => { onLogout(); onClose(); }}
                className="w-full py-3 bg-red-900/40 hover:bg-red-900/60 text-red-400 font-extrabold text-xs rounded-xl border border-red-500/30 transition shadow"
              >
                Log Out of Account
              </button>
            </div>
          </BentoTiltCard>
        </div>
      );
    }

    // --- MAIN APP WITH PERSISTENCE & MULTI-ROLE STATE ---
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('govisahana_active_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [activeView, setActiveView] = useState('landing');
      const [currentLanguage, setCurrentLanguage] = useState('en');
      const [themeMode, setThemeMode] = useState('light');
      const [isProfileOpen, setIsProfileOpen] = useState(false);

      useEffect(() => {
        document.body.className = `${themeMode}-mode lang-${currentLanguage}`;
        document.documentElement.lang = currentLanguage;
      }, [themeMode, currentLanguage]);

      const toggleTheme = () => {
        setThemeMode(prev => prev === 'dark' ? 'light' : 'dark');
      };

      const [consultations, setConsultations] = useState(() => {
        try {
          const saved = localStorage.getItem('govisahana_consultations');
          return saved ? JSON.parse(saved) : INITIAL_CONSULTATIONS;
        } catch (e) {
          return INITIAL_CONSULTATIONS;
        }
      });

      const [messages, setMessages] = useState(() => {
        try {
          const saved = localStorage.getItem('govisahana_messages');
          return saved ? JSON.parse(saved) : INITIAL_MESSAGES;
        } catch (e) {
          return INITIAL_MESSAGES;
        }
      });

      useEffect(() => {
        fetch(`${API_BASE}/api/consultations`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setConsultations(data);
            }
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('govisahana_consultations', JSON.stringify(consultations));
        } catch (e) {}
      }, [consultations]);

      useEffect(() => {
        try {
          localStorage.setItem('govisahana_messages', JSON.stringify(messages));
        } catch (e) {}
      }, [messages]);

      const [activeConsultationId, setActiveConsultationId] = useState('con_101');
      const [isTicketModalOpen, setIsTicketModalOpen] = useState(false);

      const handleAuthSuccess = (userObj) => {
        setCurrentUser(userObj);
        try {
          localStorage.setItem('govisahana_active_user', JSON.stringify(userObj));
        } catch (e) {}
        setActiveView(userObj && userObj.role === 'expert' ? 'expert_dashboard' : 'farmer_dashboard');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('govisahana_active_user');
        } catch (e) {}
        setActiveView('landing');
      };

      const handleCreateTicket = (newTicket) => {
        setConsultations([newTicket, ...consultations]);
        setMessages({
          ...messages,
          [newTicket.id]: [
            {
              id: `msg_init_${Date.now()}`,
              senderName: newTicket.farmerName,
              senderRole: 'farmer',
              text: `Consultation Ticket Created: ${newTicket.description}`,
              image: newTicket.sampleImage,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              type: 'user'
            }
          ]
        });

        fetch(`${API_BASE}/api/consultations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTicket)
        }).catch(() => {});

        setActiveConsultationId(newTicket.id);
        setActiveView('farmer_dashboard');
      };

      const handleSendMessage = (consultationId, newMessage) => {
        const existing = messages[consultationId] || [];
        setMessages({
          ...messages,
          [consultationId]: [...existing, newMessage]
        });
      };

      const handleMarkResolved = (consultationId) => {
        setConsultations(consultations.map(c => c.id === consultationId ? { ...c, status: 'Resolved' } : c));
      };

      const activeConsultation = consultations.find(c => c.id === activeConsultationId) || consultations[0];
      const activeChatMessages = messages[activeConsultationId] || [];

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar
            activeView={activeView}
            setActiveView={setActiveView}
            currentLanguage={currentLanguage}
            setCurrentLanguage={setCurrentLanguage}
            currentUser={currentUser}
            onLogout={handleLogout}
            onOpenProfile={() => setIsProfileOpen(true)}
            themeMode={themeMode}
            toggleTheme={toggleTheme}
          />

          <main className="flex-1">
            {activeView === 'landing' && <LandingPage setActiveView={setActiveView} currentLanguage={currentLanguage} themeMode={themeMode} />}
            {activeView === 'login' && <LoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />}
            {activeView === 'signup' && <SignupPage setActiveView={setActiveView} onSignupSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />}

            {activeView === 'farmer_dashboard' && (
              currentUser ? (
                <FarmerDashboard
                  currentUser={currentUser}
                  consultations={consultations}
                  onOpenNewTicketModal={() => setIsTicketModalOpen(true)}
                  onSelectConsultation={(id) => setActiveConsultationId(id)}
                  setActiveView={setActiveView}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <LoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {activeView === 'consultation_room' && (
              currentUser ? (
                <ConsultationRoom
                  currentUser={currentUser}
                  consultation={activeConsultation}
                  messages={activeChatMessages}
                  onSendMessage={handleSendMessage}
                  onMarkResolved={handleMarkResolved}
                  onBackToDashboard={() => setActiveView(currentUser && currentUser.role === 'expert' ? 'expert_dashboard' : 'farmer_dashboard')}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <LoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {activeView === 'expert_dashboard' && (
              currentUser ? (
                <ExpertDashboard
                  currentUser={currentUser}
                  consultations={consultations}
                  onSelectConsultation={(id) => setActiveConsultationId(id)}
                  setActiveView={setActiveView}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <LoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {!['landing', 'login', 'signup', 'farmer_dashboard', 'consultation_room', 'expert_dashboard'].includes(activeView) && (
              <LandingPage setActiveView={setActiveView} currentLanguage={currentLanguage} themeMode={themeMode} />
            )}
          </main>

          <NewTicketModal
            isOpen={isTicketModalOpen}
            onClose={() => setIsTicketModalOpen(false)}
            onSubmitTicket={handleCreateTicket}
            currentUser={currentUser}
            currentLanguage={currentLanguage}
            themeMode={themeMode}
          />

          <UserProfileModal
            isOpen={isProfileOpen}
            onClose={() => setIsProfileOpen(false)}
            currentUser={currentUser}
            onLogout={handleLogout}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
