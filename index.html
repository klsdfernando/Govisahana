    .bg-ambient-glow {

      pointer-events: none;

        radial-gradient(600px circle at calc(100% - var(--parallax-x, 50%)) calc(100% - var(--parallax-y, 50%)), var(--ambient-secondary), transparent 50%);

    }

    /* Glassmorphic 3D Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, background-color 0.4s;
    }

    .glass-card:hover {
      border-color: rgba(76, 175, 80, 0.5);
    }

    /* Dynamic Cursor Spotlight Radial Glow */
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--spotlight-glow), transparent 40%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }
    .glass-card:hover::before {
      opacity: 1;
    }

      border-bottom: 1px solid var(--card-border);

  <script>
    window.addEventListener('mousemove', (e) => {
      const px = (e.clientX / window.innerWidth) * 100;
      const py = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--parallax-x', `${px}%`);
      document.documentElement.style.setProperty('--parallax-y', `${py}%`);
    });
  </script>

    // --- REUSABLE 3D TILT BENTO CARD WRAPPER ---
    function BentoTiltCard({ children, className = "" }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`glass-card p-6 rounded-3xl ${className}`}
        >
          {children}
        </div>
      );
    }

    // --- LOGIN PAGE ---
    function LoginPage({ setActiveView, onLoginSuccess, currentLanguage, themeMode }) {
      const isDark = themeMode === 'dark';
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [role, setRole] = useState('farmer');
      const [email, setEmail] = useState('');
      const [otpStep, setOtpStep] = useState(false);
      const [enteredOtp, setEnteredOtp] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [resendTimer, setResendTimer] = useState(0);

      // Countdown timer for resend
      React.useEffect(() => {
        if (resendTimer > 0) {
          const t = setTimeout(() => setResendTimer(r => r - 1), 1000);
          return () => clearTimeout(t);
        }
      }, [resendTimer]);

      const handleSendOtp = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
          setEnteredOtp(data.devCode || '');
          setOtpStep(true);
          setResendTimer(60);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          // Verify OTP
          const verifyRes = await fetch(`${API_BASE}/api/otp/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code: enteredOtp })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyData.error || 'Invalid OTP');

          // Login / get user
          const loginRes = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, role })
          });
          const loginData = await loginRes.json();
          onLoginSuccess(loginData.user || { name: 'User', email, role });
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResend = async () => {
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to resend OTP');
          setResendTimer(60);
          setEnteredOtp(data.devCode || '');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 py-10">
          <div className={`max-w-md w-full rounded-3xl border shadow-xl p-6 sm:p-8 space-y-6 ${isDark ? 'bg-emerald-950/80 border-emerald-700/50' : 'bg-white border-slate-200'}`}>
            {/* Header */}
            <div className="text-center">
              <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border mb-3 ${isDark ? 'bg-emerald-900/50 text-emerald-300 border-emerald-600/40' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                Official Agritech Portal • Sri Lanka
              </div>
              <h2 className={`text-2xl font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>{t.loginTitle}</h2>
              <p className={`text-xs mt-1 max-w-xs mx-auto leading-relaxed ${isDark ? 'text-emerald-300/70' : 'text-slate-500'}`}>{t.loginSubtitle}</p>
            </div>

            {/* Role Tabs */}
            <div>
              <label className={`block text-xs font-bold mb-2 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`}>{t.loginSelectRole}</label>
              <div className={`grid grid-cols-2 gap-2 p-1 rounded-2xl border ${isDark ? 'bg-emerald-950/40 border-emerald-700/40' : 'bg-slate-100 border-slate-200'}`}>
                <button type="button" onClick={() => setRole('farmer')} className={`py-2.5 rounded-xl text-xs font-bold transition-all ${role === 'farmer' ? 'bg-emerald-700 text-white shadow-md' : (isDark ? 'text-emerald-300 hover:text-white' : 'text-slate-600 hover:text-slate-900')}`}>
                   Farmer
                </button>
                <button type="button" onClick={() => setRole('expert')} className={`py-2.5 rounded-xl text-xs font-bold transition-all ${role === 'expert' ? 'bg-amber-700 text-white shadow-md' : (isDark ? 'text-emerald-300 hover:text-white' : 'text-slate-600 hover:text-slate-900')}`}>
                  Agronomist
                </button>
              </div>
            </div>

            {/* Quick Testing & Demo Login Panel */}

                <span className="font-extrabold text-[11px] opacity-80"> One-Click Testing Accounts:</span>

                  <span className="truncate">Dr. Nimal (Expert 1)</span>
                </button>

                    email: 'priyanthi@govisahana.lk',
                    role: 'expert',
                    district: 'Kurunegala',
                    cropOrDept: 'Soil Fertility & Nutrient Specialist'

                >
                  <span className="truncate">Mrs. Priyanthi (Expert 2)</span>
                </button>
                <button

                    cropOrDept: 'Paddy / Rice'
                  })}
                  className="px-2.5 py-2 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded-xl text-left text-[11px] transition shadow-sm col-span-1 sm:col-span-2 flex items-center gap-1.5"

                  <span className="truncate">Sunil Rathnayake (Farmer Member)</span>

            {!otpStep ? (

                <div>
                  <label className={`block text-xs font-bold mb-1.5 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`}>
                     Email Address

                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="your@email.com"
                    required

                  />
                  <p className={`text-[10px] mt-1.5 ${isDark ? 'text-emerald-400/60' : 'text-slate-400'}`}>
                    A 6-digit OTP code will be sent to this email
                  </p>
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className={`w-full py-3.5 rounded-2xl text-white font-extrabold text-sm shadow transition-all active:scale-[0.99] flex items-center justify-center gap-2 ${role === 'farmer' ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-amber-700 hover:bg-amber-800'} disabled:opacity-60`}
                >
                  {loading ? 'Sending...' : 'Send OTP to Email'}
                </button>

              /* STEP 2: Enter OTP */
              <form onSubmit={handleVerifyOtp} className="space-y-4">

                  <p className={`text-xs font-bold ${isDark ? 'text-emerald-200' : 'text-slate-800'}`}>
                    OTP sent to <span className="text-emerald-600">{email}</span>
                  </p>
                  <p className={`text-[11px] ${isDark ? 'text-emerald-400/70' : 'text-slate-500'}`}>
                    Check your inbox (and spam folder). Code expires in 5 minutes.
                  </p>
                  <input
                    type="text"
                    value={enteredOtp}
                    onChange={(e) => setEnteredOtp(e.target.value.replace(/\D/g, '').slice(0, 6))}
                    placeholder="Enter 6-digit code"
                    required
                    maxLength="6"
                    className={`w-full text-center text-2xl font-black tracking-[0.3em] px-4 py-3 rounded-xl border-2 outline-none focus:ring-4 focus:ring-emerald-600/20 shadow-sm transition ${isDark ? 'bg-emerald-950/60 border-emerald-500 text-white placeholder:text-emerald-600/50' : 'bg-white border-emerald-600 text-slate-900 placeholder:text-slate-300'}`}

                    <button

                      onClick={() => { setOtpStep(false); setError(''); setEnteredOtp(''); }}

                    >
                      ← Change email
                    </button>
                    {resendTimer > 0 ? (
                      <span className={isDark ? 'text-emerald-500/60' : 'text-slate-400'}>Resend in {resendTimer}s</span>

                </div>
                <button
                  type="submit"
                  disabled={loading || enteredOtp.length < 6}
                  className={`w-full py-3.5 rounded-2xl text-white font-extrabold text-sm shadow transition-all active:scale-[0.99] ${role === 'farmer' ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-amber-700 hover:bg-amber-800'} disabled:opacity-60`}

                <span>{t.loginNoAccount} </span>

                  {t.loginRegisterLink}
                </button>
              </div>
              <p className={`text-[10px] ${isDark ? 'text-emerald-500/50' : 'text-slate-400'}`}>
                256-Bit Encrypted Sri Lanka Agrarian Database Connection
              </p>
            </div>
          </div>
        </div>

    }

    // --- SECURE PASSWORD LOGIN & RECOVERY ---
    function SecureLoginPage({ setActiveView, onLoginSuccess, currentLanguage, themeMode }) {
      const isDark = themeMode === 'dark';
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [mode, setMode] = useState('login');
      const [resetStep, setResetStep] = useState('request');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [otp, setOtp] = useState('');
      const [resetToken, setResetToken] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [resendTimer, setResendTimer] = useState(0);

      React.useEffect(() => {
        if (resendTimer <= 0) return;
        const timer = setTimeout(() => setResendTimer(value => value - 1), 1000);
        return () => clearTimeout(timer);
      }, [resendTimer]);

      const requestJson = async (url, body) => {
        const response = await fetch(`${API_BASE}${url}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed. Please try again.');
        return data;
      };

      const switchMode = (nextMode) => {
        setMode(nextMode); setResetStep('request'); setPassword(''); setNewPassword(''); setConfirmPassword('');
        setOtp(''); setResetToken(''); setError(''); setSuccess('');
      };

      const handleLogin = async (event) => {
        event.preventDefault(); setLoading(true); setError(''); setSuccess('');
        try { const data = await requestJson('/api/auth/login', { email, password }); onLoginSuccess(data.user); }
        catch (err) { setError(err.message); } finally { setLoading(false); }
      };

      const requestResetCode = async (event) => {
        if (event) event.preventDefault();
        setLoading(true); setError(''); setSuccess('');
        try {
          const data = await requestJson('/api/auth/password/forgot', { email });
          setOtp(data.devCode || ''); setResetStep('verify'); setResendTimer(60); setSuccess(data.message);
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };

      const verifyResetCode = async (event) => {
        event.preventDefault(); setLoading(true); setError(''); setSuccess('');
        try { const data = await requestJson('/api/auth/password/verify', { email, code: otp }); setResetToken(data.resetToken); setResetStep('change'); }
        catch (err) { setError(err.message); } finally { setLoading(false); }
      };

      const changePassword = async (event) => {
        event.preventDefault(); setError(''); setSuccess('');
        if (newPassword !== confirmPassword) return setError('The passwords do not match.');
        setLoading(true);
        try { const data = await requestJson('/api/auth/password/reset', { email, resetToken, newPassword }); switchMode('login'); setSuccess(data.message); }
        catch (err) { setError(err.message); } finally { setLoading(false); }
      };

      const inputClass = `w-full px-4 py-3 rounded-2xl border text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-600/20 transition-all ${isDark ? 'bg-emerald-950/50 text-white border-emerald-600/40 focus:border-emerald-500 placeholder:text-emerald-500/50' : 'bg-slate-50 text-slate-900 border-slate-200 focus:bg-white focus:border-emerald-600 placeholder:text-slate-400'}`;
      const labelClass = `block text-xs font-bold mb-1.5 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`;

      return (
        <div className="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 py-10">
          <div className={`max-w-md w-full rounded-3xl border shadow-xl p-6 sm:p-8 space-y-6 ${isDark ? 'bg-emerald-950/80 border-emerald-700/50' : 'bg-white border-slate-200'}`}>
            <div className="text-center">
              <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border mb-3 ${isDark ? 'bg-emerald-900/50 text-emerald-300 border-emerald-600/40' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}><span className="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>Secure GoviSahana Account</div>
              <h2 className={`text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>{mode === 'login' ? t.loginTitle : 'Reset your password'}</h2>
              <p className={`text-xs mt-1 ${isDark ? 'text-emerald-300/70' : 'text-slate-500'}`}>{mode === 'login' ? 'Sign in with the password you created.' : 'We will verify your email before allowing a password change.'}</p>
            </div>

            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-semibold px-4 py-3 rounded-xl"> {error}</div>}
            {success && <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold px-4 py-3 rounded-xl"> {success}</div>}

            {mode === 'login' ? (
              <form onSubmit={handleLogin} className="space-y-4">
                <div><label className={labelClass}> Email Address</label><input type="email" required autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" className={inputClass} /></div>
                <div>
                  <div className="flex items-center justify-between mb-1.5"><label className={labelClass + ' mb-0'}> Password</label><button type="button" onClick={() => switchMode('forgot')} className={`text-[11px] font-bold hover:underline ${isDark ? 'text-emerald-400' : 'text-emerald-700'}`}>Forgot password?</button></div>
                  <div className="relative"><input type={showPassword ? 'text' : 'password'} required autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter your password" className={inputClass + ' pr-16'} /><button type="button" onClick={() => setShowPassword(value => !value)} className={`absolute right-4 top-1/2 -translate-y-1/2 text-[11px] font-bold ${isDark ? 'text-emerald-400' : 'text-slate-500'}`}>{showPassword ? 'Hide' : 'Show'}</button></div>
                </div>
                <button type="submit" disabled={loading} className="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm shadow disabled:opacity-60">{loading ? 'Signing in...' : 'Sign In'}</button>
              </form>
            ) : resetStep === 'request' ? (
              <form onSubmit={requestResetCode} className="space-y-4">
                <div><label className={labelClass}> Account Email</label><input type="email" required autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" className={inputClass} /></div>
                <button type="submit" disabled={loading} className="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm disabled:opacity-60">{loading ? 'Sending...' : 'Send Reset Code'}</button>
              </form>
            ) : resetStep === 'verify' ? (
              <form onSubmit={verifyResetCode} className="space-y-4">
                <div className={`p-4 rounded-2xl border text-center ${isDark ? 'bg-emerald-950/40 border-emerald-600/40' : 'bg-emerald-50 border-emerald-200'}`}>
                  <p className={`text-xs mb-3 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`}>Enter the 6-digit code sent to <strong>{email}</strong>.</p>
                  <input type="text" inputMode="numeric" required maxLength="6" value={otp} onChange={e => setOtp(e.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="000000" className={inputClass + ' text-center text-2xl tracking-[0.3em]'} />
                  <div className="mt-3 text-[11px]">{resendTimer > 0 ? <span className={isDark ? 'text-emerald-400/70' : 'text-slate-500'}>Resend in {resendTimer}s</span> : <button type="button" onClick={() => requestResetCode()} disabled={loading} className="font-bold text-emerald-700 hover:underline">Resend code</button>}</div>
                </div>
                <button type="submit" disabled={loading || otp.length !== 6} className="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm disabled:opacity-60">{loading ? 'Checking...' : 'Verify Code'}</button>
              </form>
            ) : (
              <form onSubmit={changePassword} className="space-y-4">
                <div><label className={labelClass}>New Password</label><input type={showPassword ? 'text' : 'password'} required minLength="8" autoComplete="new-password" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="At least 8 characters" className={inputClass} /></div>
                <div><label className={labelClass}>Confirm New Password</label><input type={showPassword ? 'text' : 'password'} required minLength="8" autoComplete="new-password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} placeholder="Enter it again" className={inputClass} /></div>
                <label className={`flex items-center gap-2 text-xs ${isDark ? 'text-emerald-300' : 'text-slate-600'}`}><input type="checkbox" checked={showPassword} onChange={e => setShowPassword(e.target.checked)} /> Show passwords</label>
                <p className={`text-[11px] ${isDark ? 'text-emerald-400/70' : 'text-slate-500'}`}>Use at least 8 characters with at least one letter and one number.</p>
                <button type="submit" disabled={loading} className="w-full py-3.5 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm disabled:opacity-60">{loading ? 'Updating...' : 'Set New Password'}</button>
              </form>
            )}

            <div className={`pt-4 border-t text-center text-xs ${isDark ? 'border-emerald-700/40 text-emerald-300/70' : 'border-slate-200 text-slate-600'}`}>
              {mode === 'login' ? <><span>{t.loginNoAccount} </span><button onClick={() => setActiveView('signup')} className="font-extrabold text-emerald-700 hover:underline">{t.loginRegisterLink}</button></> : <button onClick={() => switchMode('login')} className="font-extrabold text-emerald-700 hover:underline">← Back to sign in</button>}
            </div>
          </div>
        </div>
      );
    }

    // --- SIGNUP PAGE ---
    function SignupPage({ setActiveView, onSignupSuccess, currentLanguage, themeMode }) {
      const isDark = themeMode === 'dark';
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [role, setRole] = useState('farmer');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [district, setDistrict] = useState('Anuradhapura');
      const [cropOrDept, setCropOrDept] = useState('Paddy / Rice (වී)');
      const [designation, setDesignation] = useState('Plant Pathologist');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      // OTP Step
      const [otpStep, setOtpStep] = useState(false);
      const [enteredOtp, setEnteredOtp] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [resendTimer, setResendTimer] = useState(0);

      React.useEffect(() => {
        if (resendTimer > 0) {
          const tm = setTimeout(() => setResendTimer(r => r - 1), 1000);
          return () => clearTimeout(tm);
        }
      }, [resendTimer]);

      // Step 1: Send OTP to email
      const handleSendOtp = async (e) => {
        e.preventDefault();
        setError('');
        if (password !== confirmPassword) return setError('The passwords do not match.');
        if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
          return setError('Password must be at least 8 characters and include a letter and a number.');
        }
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, purpose: 'registration' })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
          setEnteredOtp(data.devCode || '');
          setOtpStep(true);
          setResendTimer(60);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Step 2: Verify OTP then register
      const handleVerifyAndRegister = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          // Verify OTP
          const verifyRes = await fetch(`${API_BASE}/api/otp/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code: enteredOtp, purpose: 'registration' })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyData.error || 'Invalid OTP');

          // Register user
          const userObj = {
            name: name.trim(),
            email,
            phone: phone ? `+94 ${phone.trim()}` : '',
            role,
            district,
            cropOrDept: role === 'farmer' ? cropOrDept : cropOrDept,
            designation: role === 'expert' ? designation : '',
            password,
            verificationToken: verifyData.verificationToken
          };
          const regRes = await fetch(`${API_BASE}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userObj)
          });
          const regData = await regRes.json();
          if (!regRes.ok) throw new Error(regData.error || 'Account registration failed.');
          onSignupSuccess(regData.user);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResend = async () => {
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, purpose: 'registration' })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to resend OTP');
          setResendTimer(60);
          setEnteredOtp(data.devCode || '');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 py-10">
          <div className={`max-w-xl w-full rounded-3xl border shadow-xl p-6 sm:p-8 space-y-6 ${isDark ? 'bg-emerald-950/80 border-emerald-700/50' : 'bg-white border-slate-200'}`}>
            {/* Header */}
            <div className="text-center">
              <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border mb-3 ${isDark ? 'bg-emerald-900/50 text-emerald-300 border-emerald-600/40' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                Official Registry • Sri Lanka Agrarian Extension
              </div>
              <h2 className={`text-2xl sm:text-3xl font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>{t.signupTitle}</h2>
              <p className={`text-xs sm:text-sm mt-1 max-w-md mx-auto leading-relaxed ${isDark ? 'text-emerald-300/70' : 'text-slate-500'}`}>{t.signupSubtitle}</p>
            </div>

            {/* Role Tabs */}
            <div>
              <label className={`block text-xs font-bold mb-2 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`}>Registration Category:</label>
              <div className={`grid grid-cols-2 gap-2 p-1 rounded-2xl border ${isDark ? 'bg-emerald-950/40 border-emerald-700/40' : 'bg-slate-100 border-slate-200'}`}>
                <button type="button" onClick={() => setRole('farmer')} className={`py-3 px-3 rounded-xl text-xs font-bold transition-all text-left flex flex-col gap-0.5 ${role === 'farmer' ? 'bg-emerald-700 text-white shadow-md' : (isDark ? 'text-emerald-300 hover:text-white' : 'text-slate-600 hover:text-slate-900')}`}>
                  <span className="text-sm">{t.signupRoleFarmer}</span>
                  <span className={`text-[10px] ${role === 'farmer' ? 'text-emerald-100' : (isDark ? 'text-emerald-400/60' : 'text-slate-500')}`}>Get diagnostic aid & prescriptions</span>
                </button>
                <button type="button" onClick={() => setRole('expert')} className={`py-3 px-3 rounded-xl text-xs font-bold transition-all text-left flex flex-col gap-0.5 ${role === 'expert' ? 'bg-amber-700 text-white shadow-md' : (isDark ? 'text-emerald-300 hover:text-white' : 'text-slate-600 hover:text-slate-900')}`}>
                  <span className="text-sm">{t.signupRoleExpert}</span>
                  <span className={`text-[10px] ${role === 'expert' ? 'text-amber-100' : (isDark ? 'text-emerald-400/60' : 'text-slate-500')}`}>Diagnose crops & issue treatments</span>
                </button>
              </div>
            </div>

            {/* Error */}
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-semibold px-4 py-3 rounded-xl">
                 {error}
              </div>
            )}

            {!otpStep ? (
              /* STEP 1: Registration Form */
              <form onSubmit={handleSendOtp} className="space-y-4">

                {/* Full Name */}
                <div>
                  <label className={`block text-xs font-bold mb-1.5 ${isDark ? 'text-emerald-200' : 'text-slate-700'}`}>{t.signupFullName}</label>
                  <input
                    type="text" required value={name} onChange={(e) => setName(e.target.value)}
                    placeholder={role === 'farmer' ? 'e.g. Sunil Rathnayake' : 'e.g. Dr. Nimal Jayasinghe'}

                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>

            <BentoTiltCard className="!p-6">

                <div>

                      onChange={(e) => setSearchQuery(e.target.value)}

                      className="pl-9 pr-3.5 py-2.5 rounded-xl text-xs border border-slate-300 dark:border-emerald-500/30 outline-none w-full bg-white dark:bg-emerald-950/40 text-slate-900 dark:text-emerald-100 font-medium placeholder-slate-400 dark:placeholder-emerald-500/50 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition"
                    />

                  <select

                  >
                    <option value="all">{t.filterAllStatus}</option>
                    <option value="pending">{t.filterPending}</option>
                    <option value="inprogress">{t.filterInProgress}</option>
                    <option value="resolved">{t.filterResolved}</option>
                  </select>
                </div>
              </div>

              {/* Consultation Cards List */}
              <div className="space-y-4">
                {filteredConsultations.length === 0 ? (
                  <div className="text-center py-12 p-6 rounded-2xl border border-dashed border-slate-300 dark:border-emerald-500/30 bg-slate-50/50 dark:bg-emerald-950/10">
                    <svg className="w-12 h-12 mx-auto text-slate-400 dark:text-emerald-600 mb-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <p className="font-bold text-base opacity-80 mb-1">No Consultation Requests Found</p>
                    <p className="text-xs opacity-60 max-w-sm mx-auto">No crop queries match your search query or status filter. Click "REQUEST CONSULTATION" above to create a new ticket.</p>
                  </div>
                ) : (
                  filteredConsultations.map(item => {
                    const isResolved = item.status === 'Resolved';
                    const isPending = item.status === 'Pending';
                    const activeId = item._id || item.id;
                    return (
                      <div 
                        key={activeId} 
                        className={`p-5 rounded-2xl border transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-5 hover:border-emerald-500/50 hover:shadow-md group ${
                          themeMode === 'light' ? 'border-slate-200 bg-white/80' : 'border-emerald-500/20 bg-emerald-950/30'
                        }`}
                      >
                        <div className="flex items-start gap-4">
                          <div className="relative shrink-0">
                            <img 
                              src={item.sampleImage} 
                              alt="Crop sample" 
                              className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border border-slate-300 dark:border-emerald-500/30 shadow-md group-hover:scale-105 transition-transform duration-300" 
                            />
                            <span className="absolute -bottom-1 -right-1 bg-emerald-600 text-white rounded-lg p-1 text-[10px]">
                              <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            </span>
                          </div>

                          <div className="space-y-1">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className={`text-[11px] font-mono font-bold tracking-wider opacity-70 px-2 py-0.5 rounded ${
                                themeMode === 'light' ? 'bg-slate-200 text-slate-700' : 'bg-emerald-900/40 text-emerald-300'
                              }`}>
                                {item.ticketId}
                              </span>
                              <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-800 dark:text-emerald-300 border border-emerald-500/20">
                                {item.cropLabel}
                              </span>
                              <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${
                                isResolved 
                                  ? 'bg-blue-500/15 text-blue-800 dark:text-blue-300 border-blue-500/30' 
                                  : item.assignedExpertName 
                                  ? 'bg-emerald-500/15 text-emerald-800 dark:text-emerald-300 border-emerald-500/30' 
                                  : 'bg-amber-500/15 text-amber-800 dark:text-amber-300 border-amber-500/30'
                              }`}>
                                {isResolved ? 'Resolved' : item.assignedExpertName ? `Connected: ${item.assignedExpertName}` : 'Waiting for Agronomist'}
                              </span>
                            </div>

                            <h3 className={`font-extrabold text-base sm:text-lg transition-colors ${ themeMode === 'light' ? 'group-hover:text-emerald-700' : 'group-hover:text-emerald-400' }`}>
                              {item.title}
                            </h3>
                            <p className="text-xs opacity-75 line-clamp-2 leading-relaxed">
                              {item.description}
                            </p>
                          </div>
                        </div>

                        <button
                          onClick={() => { onSelectConsultation(activeId); setActiveView('consultation_room'); }}
                          className="px-5 py-3 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md transition-all duration-200 flex items-center justify-center gap-2 shrink-0 group-hover:bg-emerald-600 cursor-pointer"
                        >
                          <span>{t.btnJoinChatRoom}</span>
                          <svg className="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </button>
                      </div>
                    );
                  })
                )}
              </div>
            </BentoTiltCard>
          </div>
        </div>
      );
    }

    // --- NEW TICKET MODAL ---
    function NewTicketModal({ isOpen, onClose, onSubmitTicket, currentUser, currentLanguage }) {
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [title, setTitle] = useState('');
      const [cropType, setCropType] = useState('Paddy / Rice (වී)');
      const [description, setDescription] = useState('');
      const [photoPreview, setPhotoPreview] = useState(null);

      if (!isOpen) return null;

      const handlePhoto = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setPhotoPreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title || !description) return;
        onSubmitTicket({
          title,
          cropType: 'crop',
          cropLabel: cropType,
          description,
          sampleImage: photoPreview || 'https://ik.imagekit.io/wfnazmyxh/Govi%20Sahana/v1_exact_uploaded_picture.png',
          farmerName: currentUser?.name || 'Farmer Member',
          farmerEmail: currentUser?.email || '',
          farmerDistrict: currentUser?.district || 'Anuradhapura',
          farmerPhone: currentUser?.phone || ''
        });
        setTitle('');
        setDescription('');
        setPhotoPreview(null);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
          <BentoTiltCard className="w-full max-w-xl !p-0 overflow-hidden shadow-2xl">
            <div className="bg-gradient-to-r from-emerald-900 to-emerald-800 p-5 text-white flex items-center justify-between border-b border-emerald-700">
              <h3 className="font-extrabold text-lg text-white">{t.modalTitle}</h3>
              <button onClick={onClose} aria-label="Close consultation form" className="w-8 h-8 rounded-full bg-emerald-900 text-white font-bold text-sm">×</button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-xs font-bold opacity-80 mb-1">{t.modalIssueTitle}</label>
                <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Yellow leaf spots on paddy crop" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none font-semibold bg-transparent" />
              </div>

              <div>
                <label className="block text-xs font-bold opacity-80 mb-1">{t.modalCropType}</label>
                <select value={cropType} onChange={(e) => setCropType(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none bg-emerald-900/60 font-medium">
                  {CROP_CATEGORIES.map(c =><option key={c.id} value={c.label}>{c.label}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold opacity-80 mb-1">{t.modalDesc}</label>
                <textarea required rows="3" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Describe crop leaf symptoms, affected acreage, and duration..." className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none bg-transparent"></textarea>
              </div>

              <div>
                <label className="block text-xs font-bold opacity-80 mb-1">{t.modalUploadPhoto}</label>
                <div className="border-2 border-dashed border-emerald-500/40 rounded-2xl p-4 bg-emerald-700/10 text-center relative cursor-pointer hover:bg-emerald-700/20 transition">
                  <input type="file" accept="image/*" onChange={handlePhoto} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                  {photoPreview ? (
                    <img src={photoPreview} alt="Preview" className="max-h-36 rounded-xl mx-auto shadow" />
                  ) : (
                    <div>
                      <p className="text-xs font-bold text-emerald-500 mt-1">{t.modalUploadPhotoHint}</p>
                    </div>
                  )}
                </div>
              </div>

              <button type="submit" className="w-full py-3 bg-emerald-700 hover:bg-emerald-600 text-white font-black rounded-xl shadow-lg transition">
                {t.modalSubmit}
              </button>
            </form>
          </BentoTiltCard>
        </div>
      );
    }

    // --- CONSULTATION ROOM WITH SINGLE-EXPERT ACCESS CONTROL & REAL-TIME POLL ---
    function ConsultationRoom({ consultation, onSendMessage, onClaimTicket, onRejectTicket, onReleaseTicket, onIssuePrescription, onMarkResolved, onBackToDashboard, currentUser, currentLanguage, themeMode }) {
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const isDark = themeMode === 'dark';
      const messagesEndRef = useRef(null);

      const [text, setText] = useState('');
      const [photo, setPhoto] = useState(null);
      const [sending, setSending] = useState(false);
      const [isPrescriptionModalOpen, setIsPrescriptionModalOpen] = useState(false);
      const [prescriptionDiagnosis, setPrescriptionDiagnosis] = useState('');
      const [prescriptionTreatment, setPrescriptionTreatment] = useState('');
      const [prescriptionDosage, setPrescriptionDosage] = useState('');
      const [prescriptionTiming, setPrescriptionTiming] = useState('');

      const [currentConsultation, setCurrentConsultation] = useState(consultation || {});
      const [messages, setMessages] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      const activeId = consultation?._id || consultation?.id || '';
      const isExpert = currentUser?.role === 'expert';
      const isFarmer = currentUser?.role === 'farmer';

      const currentEmail = (currentUser?.email || '').toLowerCase().trim();
      const assignedEmail = (currentConsultation?.assignedExpertEmail || '').toLowerCase().trim();
      const suggestedEmail = (currentConsultation?.suggestedExpertEmail || '').toLowerCase().trim();

      const isUnassigned = !assignedEmail || currentConsultation?.status === 'Pending';
      const isClaimedByMe = isExpert && assignedEmail && assignedEmail === currentEmail;
      const isClaimedByOther = isExpert && assignedEmail && assignedEmail !== currentEmail;
      const isSuggestedToMe = isExpert && !assignedEmail && suggestedEmail === currentEmail && currentConsultation?.suggestionStatus === 'Pending';
      const expertCannotReply = isExpert && !isClaimedByMe;

      // Real-time polling function
      const syncChatData = async () => {
        if (!activeId) return;
        try {
          const [msgRes, conRes] = await Promise.all([
            fetch(`${API_BASE}/api/consultations/${activeId}/messages?requesterEmail=${encodeURIComponent(currentUser?.email || '')}&requesterRole=${encodeURIComponent(currentUser?.role || '')}`),
            fetch(`${API_BASE}/api/consultations/${activeId}`)
          ]);
          if (msgRes.ok) {
            const msgData = await msgRes.json();
            if (Array.isArray(msgData)) setMessages(msgData);
          }
          if (conRes.ok) {
            const conData = await conRes.json();
            if (conData && (conData._id || conData.id)) setCurrentConsultation(conData);
          }
        } catch (err) {
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        setIsLoading(true);
        syncChatData();
        const timer = setInterval(syncChatData, 2500);
        return () => clearInterval(timer);
      }, [activeId]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSend = async (e) => {
        e.preventDefault();
        if ((!text.trim() && !photo) || sending) return;
        if (isClaimedByOther || expertCannotReply) return;

        const payload = {
          senderName: currentUser?.name || 'User',
          senderRole: currentUser?.role || 'farmer',
          senderEmail: currentUser?.email || '',
          text: text.trim(),
          image: photo
        };

        setSending(true);
        setText('');
        setPhoto(null);

        // Optimistic append
        const tempMsg = {
          id: `temp_${Date.now()}`,
          _id: `temp_${Date.now()}`,
          consultationId: activeId,
          ...payload,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: new Date().toISOString()
        };
        setMessages(prev => [...prev, tempMsg]);

        const savedMsg = await onSendMessage(activeId, payload);
        if (savedMsg) {
          syncChatData();
        }
        setSending(false);
      };

      const handlePresetSelect = (preset) => {
        setPrescriptionDiagnosis(preset.name);
        setPrescriptionTreatment(preset.treatment);
        setPrescriptionDosage(preset.dosage);
        setPrescriptionTiming(preset.timing);
      };

      const handleIssuePrescriptionSubmit = async (e) => {
        e.preventDefault();
        if (!prescriptionDiagnosis || !prescriptionTreatment) return;
        const rx = {
          diagnosis: prescriptionDiagnosis,
          treatment: prescriptionTreatment,
          dosage: prescriptionDosage,
          timing: prescriptionTiming,
          expertName: currentUser?.name || 'Senior Agronomist',
          expertEmail: currentUser?.email || 'nimal@govisahana.lk'
        };
        const ok = await onIssuePrescription(activeId, rx);
        if (ok) {
          setIsPrescriptionModalOpen(false);
          syncChatData();
        }
      };

      const handleClaimClick = async () => {
        const ok = await onClaimTicket(activeId);
        if (ok) syncChatData();
      };

      const handleReleaseClick = async () => {
        if (!confirm('Are you sure you want to release this consultation back to the open agronomist desk?')) return;
        const ok = await onReleaseTicket(activeId);
        if (ok) syncChatData();
      };

      const handleRejectClick = async () => {
        if (!isSuggestedToMe) return;
        const ok = await onRejectTicket(activeId);
        if (ok) syncChatData();
      };

      const expertObj = EXPERT_PROFILES.find(e => e.email?.toLowerCase() === assignedEmail) || EXPERT_PROFILES[0];
      const expertDisplayName = currentConsultation?.assignedExpertName || expertObj.name;
      const isResolved = currentConsultation?.status === 'Resolved';

      return (
        <div className="h-[calc(100vh-4rem)] flex flex-col">
          
          {/* Header Controls */}
          <div className="glass-nav border-b border-emerald-500/20 p-4 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 no-print">
            <div className="flex items-center gap-3 w-full sm:w-auto">
              <button 
                onClick={onBackToDashboard} 
                className="px-3 py-1.5 rounded-xl border border-emerald-500/30 font-bold text-xs hover:bg-emerald-700/10 transition shrink-0"
              >
                {t.chatDashboardBack}
              </button>

              <div className="flex items-center gap-2.5 border-l border-emerald-500/20 pl-3">
                {currentConsultation?.assignedExpertName ? (
                  <div className="flex items-center gap-2.5">
                    <img 
                      src={expertObj.avatar} 
                      alt={expertDisplayName} 
                      className="w-10 h-10 rounded-full object-cover border-2 border-emerald-500 shadow shrink-0" 
                    />
                    <div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <h3 className="font-extrabold text-sm">{expertDisplayName}</h3>
                        <span className="text-[10px] bg-emerald-700/20 text-emerald-500 px-1.5 py-0.2 rounded border border-emerald-500/30 font-bold">
                          {t.chatOfficerBadge}
                        </span>
                        {isClaimedByMe && (
                          <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-extrabold px-1.5 py-0.2 rounded border border-emerald-500/40">
                            Assigned to You
                          </span>
                        )}
                        {isClaimedByOther && (
                          <span className="text-[10px] bg-red-500/20 text-red-400 font-extrabold px-1.5 py-0.2 rounded border border-red-500/40 flex items-center gap-1">
                             Locked to Colleague
                          </span>
                        )}
                      </div>
                      <p className="text-[11px] opacity-70">
                        {currentConsultation?.ticketId} • {currentConsultation?.cropLabel || 'Crop'} • {currentConsultation?.farmerDistrict} District
                      </p>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <div className="w-9 h-9 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center font-black text-sm border border-amber-500/40">
                      Pending acceptance
                    </div>
                    <div>
                      <h3 className="font-extrabold text-sm text-amber-400">Waiting for an Expert to Accept</h3>
                      <p className="text-[11px] opacity-70">
                        Ticket: {currentConsultation?.ticketId} • {currentConsultation?.suggestedExpertName ? `Suggested to ${currentConsultation.suggestedExpertName}` : 'Open to all experts'}
                      </p>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Action Bar based on Role & Claim state */}
            <div className="flex items-center gap-2 self-end sm:self-center flex-wrap">
              {isExpert && isUnassigned && (
                <>
                  <button
                    onClick={handleClaimClick}
                    className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg transition transform hover:scale-105 flex items-center gap-1.5"
                  >
                    <span>{isSuggestedToMe ? 'Accept Suggested Case' : 'Accept Consultation'}</span>
                  </button>
                  {isSuggestedToMe && (
                    <button onClick={handleRejectClick} className="px-3 py-2 bg-red-950/50 hover:bg-red-900/60 text-red-300 font-black text-xs rounded-xl border border-red-500/40 transition">
                      Reject
                    </button>
                  )}
                </>
              )}

              {isExpert && isClaimedByMe && (
                <>
                  {!isResolved && (
                    <button 
                      onClick={() => setIsPrescriptionModalOpen(true)} 
                      className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow transition flex items-center gap-1"
                    >
                      <span>{t.btnIssuePrescription}</span>
                    </button>
                  )}
                  {!isResolved && (
                    <button 
                      onClick={() => onMarkResolved(activeId)} 
                      className="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white font-bold text-xs rounded-xl shadow transition"
                    >
                      {t.btnMarkResolved}
                    </button>
                  )}
                  <button 
                    onClick={handleReleaseClick} 
                    className="px-2.5 py-1.5 bg-red-950/40 hover:bg-red-900/50 text-red-400 font-bold text-xs rounded-xl border border-red-500/30 transition"
                    title="Release case back to open agronomist queue"
                  >
                    ⇄ Release Case
                  </button>
                </>
              )}

              <button 
                onClick={() => alert("Connecting direct voice line with Agronomist Extension Desk...")} 
                className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-1"
              >
                <span className="hidden sm:inline">{t.btnVoiceCall}</span>
              </button>
            </div>
          </div>

          {/* Locked / Assigned Banners */}
          {isClaimedByOther && (
            <div className="bg-red-950/70 border-b border-red-500/40 px-4 py-2.5 text-center text-xs text-red-200 flex items-center justify-center gap-2">
              <span>
                <strong>Single Expert Exclusive Case:</strong> This consultation is exclusively assigned to <strong>{currentConsultation.assignedExpertName}</strong> ({currentConsultation.assignedExpertEmail}). You can inspect the record in read-only mode.
              </span>
            </div>
          )}

          {isExpert && isUnassigned && (
            <div className="bg-amber-950/70 border-b border-amber-500/40 px-4 py-2.5 text-center text-xs text-amber-200 flex items-center justify-center gap-2">
              <span>
                <strong>{isSuggestedToMe ? 'Suggested for You:' : 'Open Inquiry:'}</strong> Accept this request to become the farmer's assigned expert. The first expert to accept gets the private chat.
              </span>
            </div>
          )}

          {/* Main Messages Stream */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll">
            <div className="max-w-3xl mx-auto space-y-4">
              
              {/* Voice Note Simulator Pill */}
              <div className="bg-emerald-950/40 p-3 rounded-2xl border border-emerald-500/30 flex items-center justify-between no-print">
                <div className="flex items-center gap-2 text-xs font-bold text-emerald-300">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>{t.playVoiceNote}</span>
                </div>
                <button 
                  onClick={() => alert("Playing audio explanation from Agronomist in Sinhala...")} 
                  className="px-3 py-1 bg-emerald-700 text-white font-bold text-xs rounded-lg shadow hover:bg-emerald-600 transition"
                >
                  Play Audio Note
                </button>
              </div>

              {isLoading && messages.length === 0 && (
                <div className="text-center py-8 text-xs font-bold opacity-60">
                  Loading consultation messages...
                </div>
              )}

              {messages.map((msg, idx) => {
                const isSys = msg.senderRole === 'system';
                const isMsgRx = msg.prescription || msg.type === 'prescription';
                const isMyMessage = (msg.senderEmail && currentUser?.email && msg.senderEmail.toLowerCase() === currentUser.email.toLowerCase()) || 
                                    (msg.senderRole === currentUser?.role && msg.senderName === currentUser?.name);

                if (isSys) {
                  return (
                    <div key={msg._id || msg.id || idx} className="text-center my-2">
                      <span className="inline-block px-3 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-[11px] font-bold text-emerald-300">
                        {msg.text}
                      </span>
                    </div>
                  );
                }

                if (isMsgRx) {
                  const rx = msg.prescription || {};
                  return (
                    <div key={msg._id || msg.id || idx} className="printable-prescription bg-amber-950/50 border-2 border-amber-500/60 rounded-2xl p-5 shadow-xl max-w-xl mx-auto">
                      <div className="flex items-center justify-between border-b border-amber-500/30 pb-3 mb-3">
                        <div>
                          <span className="text-[10px] font-black uppercase text-amber-500 bg-amber-950 px-2 py-0.5 rounded border border-amber-700">Official Agronomist Remedy Card</span>
                          <h4 className="font-black text-amber-300 text-base mt-1">{rx.title || 'Official Remedy'}</h4>
                        </div>
                        <button onClick={() => window.print()} className="no-print px-3 py-1 bg-amber-600 text-slate-950 font-black text-xs rounded-lg shadow hover:bg-amber-500 transition">
                          {t.btnPrintPrescription}
                        </button>
                      </div>

                      <div className="space-y-2.5 text-xs">
                        <div>
                          <span className="font-extrabold text-amber-400">Target Treatment / Chemical:</span>
                          <p className="font-bold text-white text-sm bg-amber-950/70 p-2.5 rounded-xl border border-amber-500/20 mt-0.5">{rx.treatment}</p>
                        </div>
                        <div>
                          <span className="font-extrabold text-amber-400">Mixing Ratio & Dosage:</span>
                          <p className="font-semibold text-amber-100 opacity-90">{rx.dosage}</p>
                        </div>
                        <div>
                          <span className="font-extrabold text-amber-400">Timing & Safety Warnings:</span>
                          <p className="font-semibold text-amber-100 opacity-90">{rx.timing}</p>
                        </div>
                      </div>

                      <div className="mt-4 pt-3 border-t border-amber-500/20 flex items-center justify-between text-[11px] font-bold text-amber-400">
                        <span>Issued By: {rx.expertName || expertDisplayName}</span>
                        <span>{rx.date || 'Today'}</span>
                      </div>
                    </div>
                  );
                }

                return (
                  <div key={msg._id || msg.id || idx} className={`flex items-end gap-2 ${msg.senderRole === 'farmer' ? 'justify-end' : 'justify-start'}`}>
                    {msg.senderRole !== 'farmer' && <ProfileAvatar user={{ name: msg.senderName, profileImage: msg.senderProfileImage }} size="w-8 h-8" textSize="text-[10px]" />}
                    <div className={`max-w-md rounded-2xl p-3.5 shadow-md ${
                      msg.senderRole === 'farmer' 
                        ? 'bg-emerald-700 text-white font-medium' 
                        : 'bg-emerald-950/90 text-white border border-emerald-500/40'
                    }`}>
                      <div className="text-[10px] opacity-80 font-bold mb-1 flex items-center justify-between gap-3">
                        <span>{msg.senderName} ({msg.senderRole === 'expert' ? 'Agronomist' : 'Farmer'})</span>
                        <span>{msg.timestamp}</span>
                      </div>
                      {msg.image && (
                        <img 
                          src={msg.image} 
                          alt="Attached crop photo" 
                          className="rounded-xl max-h-60 w-full object-cover mb-2 border border-emerald-500/40 shadow cursor-pointer hover:opacity-95 transition"
                          onClick={() => window.open(msg.image, '_blank')}
                        />
                      )}
                      <p className="text-xs sm:text-sm font-medium leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                    </div>
                    {msg.senderRole === 'farmer' && <ProfileAvatar user={{ name: msg.senderName, profileImage: msg.senderProfileImage }} size="w-8 h-8" textSize="text-[10px]" />}
                  </div>
                );
              })}

              <div ref={messagesEndRef} />
            </div>
          </div>

          {/* Photo attachment preview bar */}
          {photo && (
            <div className="bg-emerald-700/20 p-2 px-4 border-t border-emerald-500/20 flex items-center justify-between no-print max-w-3xl mx-auto w-full">
              <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                <span>Crop Photo Attached (Ready to Send)</span>
              </span>
              <button onClick={() => setPhoto(null)} className="text-xs text-red-400 font-bold hover:underline cursor-pointer">Remove</button>
            </div>
          )}

          {/* Message Input Controls or Locked Banner */}
          <div className="glass-nav border-t border-emerald-500/20 p-3 no-print">
            {isClaimedByOther || expertCannotReply ? (
              <div className="max-w-3xl mx-auto text-center py-2">
                <span className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-red-950/40 border border-red-500/40 text-red-300 font-bold text-xs">
                  <span>{isClaimedByOther ? `Chat assigned to ${currentConsultation.assignedExpertName}.` : 'Accept this consultation before replying in the private chat.'}</span>
                </span>
              </div>
            ) : (
              <form onSubmit={handleSend} className="max-w-3xl mx-auto flex gap-2">
                <label className="p-2.5 rounded-xl bg-emerald-700/20 border border-emerald-500/30 cursor-pointer hover:bg-emerald-700/30 transition flex items-center justify-center shrink-0">
                  <input 
                    type="file" 
                    accept="image/*" 
                    onChange={(e) => {
                      const file = e.target.files[0];
                      if (file) {
                        const reader = new FileReader();
                        reader.onloadend = () => setPhoto(reader.result);
                        reader.readAsDataURL(file);
                      }
                    }} 
                    className="hidden" 
                  />
                  <span className="text-[11px] font-extrabold px-1">Attach photo</span>
                </label>
                <input 
                  type="text" 
                  value={text} 
                  onChange={(e) => setText(e.target.value)} 
                  placeholder={isExpert ? "Type agronomist advisory reply..." : t.chatInputPlaceholder} 
                  className="flex-1 px-4 py-2 rounded-xl border border-emerald-500/30 text-xs sm:text-sm outline-none font-medium bg-transparent focus:border-emerald-500" 
                />
                <button 
                  type="submit" 
                  disabled={sending || (!text.trim() && !photo)}
                  className="px-5 py-2 bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 text-white font-black text-xs rounded-xl shadow transition shrink-0 cursor-pointer"
                >
                  {sending ? '...' : t.btnSend}
                </button>
              </form>
            )}
          </div>

          {/* Prescription Modal for Experts */}
          {isPrescriptionModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn no-print">
              <BentoTiltCard className="w-full max-w-xl !p-0 overflow-hidden shadow-2xl">
                <div className="bg-gradient-to-r from-amber-950 to-amber-900 p-5 text-white flex items-center justify-between border-b border-amber-800">
                  <h3 className="font-extrabold text-lg text-white">{t.prescriptionTitle}</h3>
                  <button onClick={() => setIsPrescriptionModalOpen(false)} aria-label="Close prescription form" className="w-8 h-8 rounded-full bg-amber-900 text-white font-bold text-sm">×</button>
                </div>

                <form onSubmit={handleIssuePrescriptionSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-amber-400 mb-1">{t.prescriptionSelectPreset}</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {PRESET_DIAGNOSES.map((p, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => handlePresetSelect(p)}
                          className="p-2 text-left bg-amber-950/40 hover:bg-amber-900/60 rounded-xl border border-amber-500/30 text-[11px] font-bold text-amber-200 transition"
                        >
                           {p.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold opacity-80 mb-1">{t.prescriptionDiagnosis}</label>
                    <input type="text" required value={prescriptionDiagnosis} onChange={(e) => setPrescriptionDiagnosis(e.target.value)} placeholder="Paddy Blast (Magnaporthe oryzae)" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none font-semibold bg-transparent" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold opacity-80 mb-1">{t.prescriptionTreatment}</label>
                    <input type="text" required value={prescriptionTreatment} onChange={(e) => setPrescriptionTreatment(e.target.value)} placeholder="Spray Tricyclazole 75% WP" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none font-semibold bg-transparent" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold opacity-80 mb-1">{t.prescriptionDosage}</label>
                      <input type="text" required value={prescriptionDosage} onChange={(e) => setPrescriptionDosage(e.target.value)} placeholder="0.6g per 1L water" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none font-semibold bg-transparent" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold opacity-80 mb-1">{t.prescriptionTiming}</label>
                      <input type="text" value={prescriptionTiming} onChange={(e) => setPrescriptionTiming(e.target.value)} placeholder="Early morning before 9 AM" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-500/30 text-sm outline-none font-semibold bg-transparent" />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black rounded-xl shadow-lg transition">
                    {t.btnSubmitPrescription}
                  </button>
                </form>
              </BentoTiltCard>
            </div>
          )}
        </div>
      );
    }

    // --- EXPERT DASHBOARD: WITH UNCLAIMED QUEUE, SINGLE-EXPERT LOCKING, & RESOLUTION TABS ---
    function ExpertDashboard({ currentUser, consultations, onSelectConsultation, onClaimTicket, onRejectTicket, onReleaseTicket, setActiveView, currentLanguage, themeMode }) {
      const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
      const [districtFilter, setDistrictFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTab, setActiveTab] = useState('unassigned'); // 'unassigned' | 'my_claimed' | 'other_claimed' | 'resolved'

      const currentEmail = (currentUser?.email || '').toLowerCase().trim();

      // Filtered cohorts
      const unassignedList = consultations.filter(c => !c.assignedExpertEmail || c.status === 'Pending');
      const myClaimedList = consultations.filter(c => c.assignedExpertEmail && c.assignedExpertEmail.toLowerCase() === currentEmail && c.status !== 'Resolved');
      const otherClaimedList = consultations.filter(c => c.assignedExpertEmail && c.assignedExpertEmail.toLowerCase() !== currentEmail && c.status !== 'Resolved');
      const resolvedList = consultations.filter(c => c.status === 'Resolved');

      // Select target pool for active tab
      let tabPool = [];
      if (activeTab === 'unassigned') tabPool = unassignedList;
      else if (activeTab === 'my_claimed') tabPool = myClaimedList;
      else if (activeTab === 'other_claimed') tabPool = otherClaimedList;
      else if (activeTab === 'resolved') tabPool = resolvedList;

      const filtered = tabPool.filter(c => {
        const matchesDistrict = districtFilter === 'all' || c.farmerDistrict === districtFilter;
        const matchesSearch = (c.title || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (c.farmerName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (c.ticketId || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (c.cropLabel || '').toLowerCase().includes(searchQuery.toLowerCase());
        return matchesDistrict && matchesSearch;
      });

      return (
        <div className="min-h-screen pb-16">
          {/* Expert Hero Header */}
          <div className="bg-gradient-to-r from-slate-900 via-emerald-950 to-amber-950 text-white py-8 px-4 sm:px-6 lg:px-8 border-b border-amber-900/50 shadow-xl relative overflow-hidden">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
              <div>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-3 py-1 rounded-full border border-amber-500/40 shadow-sm flex items-center gap-1.5">
                    Official Extension Officer Desk
                  </span>
                  <span className="text-xs bg-emerald-500/20 text-emerald-300 font-bold px-3 py-1 rounded-full border border-emerald-500/40">
                    Extension Division • Peradeniya
                  </span>
                  <span className="text-xs bg-white/10 text-white/90 font-bold px-3 py-1 rounded-full border border-white/20">
                    Logged in as: {currentUser?.email}
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl lg:text-4xl font-black tracking-tight text-white">
                  {currentUser?.name || 'Dr. Nimal Jayasinghe'}
                </h1>
                <p className="text-xs sm:text-sm text-amber-200/80 mt-1 font-medium">
                  {currentUser?.cropOrDept || 'Senior Agronomist & Plant Pathologist'} • Single-Expert Case Claiming System
                </p>
              </div>

              {/* District Filter Dropdown */}
              <div className="flex items-center gap-3 shrink-0">
                <button
                  onClick={() => setActiveView('chat_hub')}
                  className="px-4 py-3 rounded-xl text-xs font-black bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400/40 shadow-lg transition flex items-center gap-2"
                >
                  <span>Open Chat Centre</span>
                </button>
                <select
                  value={districtFilter}
                  onChange={(e) => setDistrictFilter(e.target.value)}
                  className="px-4 py-3 rounded-xl text-xs font-black bg-slate-900/90 text-amber-100 border border-amber-500/40 outline-none cursor-pointer shadow-lg hover:border-amber-400 transition"
                >
                  <option value="all">All Sri Lankan Districts ({SRI_LANKAN_DISTRICTS.length})</option>
                  {SRI_LANKAN_DISTRICTS.map(d =><option key={d} value={d}>{d} District</option>)}
                </select>
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-8">
            
            {/* Quick Metrics Bar */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <button 
                onClick={() => setActiveTab('unassigned')}
                className={`text-left p-5 rounded-2xl border transition shadow-sm ${activeTab === 'unassigned' ? 'ring-2 ring-amber-500 bg-amber-500/10 border-amber-500/40' : 'border-slate-200 dark:border-emerald-500/20 bg-white/60 dark:bg-emerald-950/30'}`}
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-bold opacity-75"> Available Inquiries</span>
                  <span className="text-xs font-black bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">{unassignedList.length}</span>
                </div>
                <p className="text-2xl sm:text-3xl font-black text-amber-400">{unassignedList.length}</p>
                <p className="text-[11px] opacity-70">Unclaimed by specialists</p>
              </button>

              <button 
                onClick={() => setActiveTab('my_claimed')}
                className={`text-left p-5 rounded-2xl border transition shadow-sm ${activeTab === 'my_claimed' ? 'ring-2 ring-emerald-500 bg-emerald-500/10 border-emerald-500/40' : 'border-slate-200 dark:border-emerald-500/20 bg-white/60 dark:bg-emerald-950/30'}`}
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-bold opacity-75"> My Claimed Chats</span>
                  <span className="text-xs font-black bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">{myClaimedList.length}</span>
                </div>
                <p className="text-2xl sm:text-3xl font-black text-emerald-400">{myClaimedList.length}</p>
                <p className="text-[11px] opacity-70">Exclusively assigned to you</p>
              </button>

              <button 
                onClick={() => setActiveTab('other_claimed')}
                className={`text-left p-5 rounded-2xl border transition shadow-sm ${activeTab === 'other_claimed' ? 'ring-2 ring-red-500 bg-red-500/10 border-red-500/40' : 'border-slate-200 dark:border-emerald-500/20 bg-white/60 dark:bg-emerald-950/30'}`}
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-bold opacity-75"> Colleagues' Cases</span>
                  <span className="text-xs font-black bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full">{otherClaimedList.length}</span>
                </div>
                <p className="text-2xl sm:text-3xl font-black text-red-400">{otherClaimedList.length}</p>
                <p className="text-[11px] opacity-70">Locked to other experts</p>
              </button>

              <button 
                onClick={() => setActiveTab('resolved')}
                className={`text-left p-5 rounded-2xl border transition shadow-sm ${activeTab === 'resolved' ? 'ring-2 ring-blue-500 bg-blue-500/10 border-blue-500/40' : 'border-slate-200 dark:border-emerald-500/20 bg-white/60 dark:bg-emerald-950/30'}`}
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-bold opacity-75"> Resolved Cases</span>
                  <span className="text-xs font-black bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full">{resolvedList.length}</span>
                </div>
                <p className="text-2xl sm:text-3xl font-black text-blue-400">{resolvedList.length}</p>
                <p className="text-[11px] opacity-70">Prescriptions issued</p>
              </button>
            </div>

            {/* Queue Management Card */}
            <BentoTiltCard className="!p-6">
              
              {/* Header & Tabs */}
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-amber-500/20">
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-xl font-black tracking-tight">
                      {activeTab === 'unassigned' && ' Available Farmer Inquiries (Waiting for Acceptance)'}
                      {activeTab === 'my_claimed' && ' My Claimed Consultations (Exclusively Yours)'}
                      {activeTab === 'other_claimed' && ' Colleagues\' Consultations (Read-Only)'}
                      {activeTab === 'resolved' && ' Resolved Cases History'}
                    </h2>
                    <span className="text-xs bg-amber-500/20 text-amber-400 font-extrabold px-2.5 py-0.5 rounded-full">
                      {filtered.length} Cases
                    </span>
                  </div>
                  <p className="text-xs opacity-70 mt-1">
