                    {activeTab === 'unassigned' && 'The system suggests a matching expert, but any expert can accept. The first acceptance gets the private chat.'}
                    {activeTab === 'my_claimed' && 'These cases are accessible only by you and the farmer. Other experts cannot reply.'}
                    {activeTab === 'other_claimed' && 'These cases are actively claimed by other agronomists. Access is restricted.'}
                    {activeTab === 'resolved' && 'Official agronomist remedy cards issued.'}
                  </p>
                </div>

                {/* Search Bar */}
                <div className="w-full sm:w-72">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search by crop, farmer, or ticket ID..."
                    className="w-full px-4 py-2.5 rounded-xl text-xs border border-slate-300 dark:border-emerald-500/30 outline-none bg-white dark:bg-emerald-950/40 text-slate-900 dark:text-emerald-100 font-medium placeholder-slate-400 dark:placeholder-emerald-500/50 focus:border-amber-500 transition shadow-sm"
                  />
                </div>
              </div>

              {/* Items List */}
              <div className="space-y-4">
                {filtered.length === 0 ? (
                  <div className="text-center py-12 p-6 rounded-2xl border border-dashed border-slate-300 dark:border-amber-500/30 bg-slate-50/50 dark:bg-emerald-950/10">
                    <p className="font-bold text-base opacity-80 mb-1">No Consultations in this View</p>
                    <p className="text-xs opacity-60 max-w-sm mx-auto">
                      {activeTab === 'unassigned' && ' All incoming farmer inquiries are currently claimed and handled!'}
                      {activeTab === 'my_claimed' && 'You have no open claimed cases. Claim a pending inquiry from the Available tab!'}
                      {activeTab === 'other_claimed' && 'No cases are currently assigned to other agronomists.'}
                      {activeTab === 'resolved' && 'No resolved cases found matching your filters.'}
                    </p>
                  </div>
                ) : (
                  filtered.map(c => {
                    const cid = c._id || c.id;
                    const isMine = c.assignedExpertEmail && c.assignedExpertEmail.toLowerCase() === currentEmail;
                    const isOther = c.assignedExpertEmail && c.assignedExpertEmail.toLowerCase() !== currentEmail;
                    const isUnclaimed = !c.assignedExpertEmail || c.status === 'Pending';
                    const isSuggestedToMe = isUnclaimed && c.suggestionStatus === 'Pending' && String(c.suggestedExpertEmail || '').toLowerCase() === currentEmail;

                    return (
                      <div 
                        key={cid} 
                        className={`p-5 rounded-2xl border transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-5 hover:border-amber-500/50 hover:shadow-md group ${
                          isMine 
                            ? 'border-emerald-500/40 bg-emerald-950/20' 
                            : isOther 
                            ? 'border-red-500/30 bg-red-950/10' 
                            : 'border-amber-500/30 bg-amber-950/10'
                        }`}
                      >
                        <div className="flex items-start gap-4">
                          <img 
                            src={c.sampleImage} 
                            alt="Farmer crop request" 
                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border border-slate-300 dark:border-emerald-500/30 shadow-md group-hover:scale-105 transition-transform duration-300 shrink-0 cursor-pointer" 
                            onClick={() => window.open(c.sampleImage, '_blank')}
                          />
                          <div className="space-y-1.5">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-[11px] font-bold bg-amber-500/10 text-amber-700 dark:text-amber-300 px-2.5 py-0.5 rounded-full border border-amber-500/30">
                                 {c.farmerDistrict}
                              </span>
                              <span className="text-xs font-bold bg-emerald-500/10 text-emerald-800 dark:text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                                {c.cropLabel}
                              </span>
                              <span className="text-xs font-mono opacity-70 px-2 py-0.5 rounded bg-slate-200 dark:bg-emerald-900/40 text-slate-700 dark:text-emerald-300">
                                {c.ticketId}
                              </span>

                              {/* Assignment status badge */}
                              {isUnclaimed && (
                                <span className="text-xs font-extrabold bg-amber-500/20 text-amber-400 px-2.5 py-0.5 rounded-full border border-amber-500/40">
                                   Waiting for Acceptance
                                </span>
                              )}
                              {isSuggestedToMe && (
                                <span className="text-xs font-extrabold bg-purple-500/20 text-purple-300 px-2.5 py-0.5 rounded-full border border-purple-500/40">
                                   Suggested for You
                                </span>
                              )}
                              {isMine && (
                                <span className="text-xs font-extrabold bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/40">
                                   Assigned to You
                                </span>
                              )}
                              {isOther && (
                                <span className="text-xs font-extrabold bg-red-500/20 text-red-400 px-2.5 py-0.5 rounded-full border border-red-500/40 flex items-center gap-1">
                                   Claimed by {c.assignedExpertName}
                                </span>
                              )}
                            </div>

                            <h3 className="font-extrabold text-base sm:text-lg text-slate-900 dark:text-white">
                              {c.title}
                            </h3>
                            <p className="text-xs opacity-75 leading-relaxed line-clamp-2">
                              {c.description}
                            </p>
                            <p className="text-[11px] opacity-70 font-semibold pt-0.5">
                              Farmer: <strong className="font-extrabold text-slate-900 dark:text-emerald-300">{c.farmerName}</strong> {c.farmerPhone ? `• ${c.farmerPhone}` : ''}
                            </p>
                          </div>
                        </div>

                        {/* Action buttons */}
                        <div className="flex items-center gap-2 shrink-0">
                          {isUnclaimed && (
                            <>
                              <button
                                onClick={async () => {
                                  const ok = await onClaimTicket(cid);
                                  if (ok) {
                                    onSelectConsultation(cid);
                                    setActiveView('consultation_room');
                                  }
                                }}
                                className="px-5 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer transform hover:scale-105"
                              >
                                <span>{isSuggestedToMe ? 'Accept Suggested Case →' : 'Accept & Open Chat →'}</span>
                              </button>
                              {isSuggestedToMe && (
                                <button onClick={() => onRejectTicket(cid)} className="px-4 py-3 bg-red-950/40 hover:bg-red-900/60 text-red-400 font-black text-xs rounded-xl border border-red-500/30 transition">
                                  Reject
                                </button>
                              )}
                            </>
                          )}

                          {isMine && (
                            <>
                              <button
                                onClick={() => { onSelectConsultation(cid); setActiveView('consultation_room'); }}
                                className="px-5 py-3 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer"
                              >
                                <span>Open Chat Room →</span>
                              </button>
                              <button
                                onClick={async () => {
                                  if (confirm('Release this ticket back to the open queue?')) {
                                    await onReleaseTicket(cid);
                                  }
                                }}
                                className="px-3 py-3 bg-red-950/40 hover:bg-red-900/60 text-red-400 font-bold text-xs rounded-xl border border-red-500/30 transition"
                                title="Release ticket back to open pool"
                              >
                                ⇄ Release
                              </button>
                            </>
                          )}

                          {isOther && (
                            <button
                              onClick={() => { onSelectConsultation(cid); setActiveView('consultation_room'); }}
                              className="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-amber-200 font-bold text-xs rounded-xl border border-amber-500/30 shadow flex items-center gap-1.5 cursor-pointer"
                            >
                              <span>View (Locked to {c.assignedExpertName})</span>
                            </button>
                          )}

                          {c.status === 'Resolved' && (
                            <button
                              onClick={() => { onSelectConsultation(cid); setActiveView('consultation_room'); }}
                              className="px-4 py-3 bg-blue-700 hover:bg-blue-600 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5 cursor-pointer"
                            >
                              <span>View Remedy Card</span>
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </BentoTiltCard>
          </div>
        </div>
      );
    }

    // --- ROLE-AWARE CHAT CENTRE: GLOBAL COMMUNITY + PRIVATE CONSULTATIONS ---
    function ChatHub({ currentUser, consultations, onSelectConsultation, onClaimTicket, onRejectTicket, onOpenNewTicketModal, setActiveView, themeMode }) {
      const isExpert = currentUser?.role === 'expert';
      const isDark = themeMode === 'dark';
      const [channel, setChannel] = useState('global');
      const [globalMessages, setGlobalMessages] = useState([]);
      const [messageText, setMessageText] = useState('');
      const [sending, setSending] = useState(false);
      const [loading, setLoading] = useState(true);
      const messagesEndRef = useRef(null);
      const email = String(currentUser?.email || '').toLowerCase();

      const farmerConsultations = consultations.filter(item => String(item.farmerEmail || '').toLowerCase() === email);
      const assignedChats = consultations.filter(item => String(item.assignedExpertEmail || '').toLowerCase() === email && item.status !== 'Resolved');
      const openChats = consultations.filter(item => !item.assignedExpertEmail && item.status === 'Pending');
      const resolvedChats = consultations.filter(item => String(item.assignedExpertEmail || '').toLowerCase() === email && item.status === 'Resolved');

      const navItems = isExpert ? [
        { id: 'global', label: 'Global Group Chat', sub: 'Farmers + experts', count: null },
        { id: 'assigned', label: 'My Assigned Chats', sub: 'Private consultations', count: assignedChats.length },
        { id: 'open', label: 'Open Requests', sub: 'Waiting for an expert', count: openChats.length },
        { id: 'resolved', label: 'Resolved Chats', sub: 'Completed cases', count: resolvedChats.length }
      ] : [
        { id: 'global', label: 'Group Chat', sub: 'Talk with the community', count: null },
        { id: 'personal', label: 'Personal Chat', sub: 'Ask an assigned expert', count: farmerConsultations.length }
      ];

      const loadGlobalMessages = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/global-chat/messages`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) setGlobalMessages(data);
          }
        } catch (err) {
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (channel !== 'global') return undefined;
        loadGlobalMessages();
        const poll = setInterval(loadGlobalMessages, 2500);
        return () => clearInterval(poll);
      }, [channel]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [globalMessages]);

      const sendGlobalMessage = async (event) => {
        event.preventDefault();
        const text = messageText.trim();
        if (!text || sending) return;
        setSending(true);
        setMessageText('');
        try {
          const res = await fetch(`${API_BASE}/api/global-chat/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              senderName: currentUser.name,
              senderRole: currentUser.role,
              senderEmail: currentUser.email,
              senderProfileImage: currentUser.profileImage || '',
              text
            })
          });
          if (!res.ok) {
            const data = await res.json();
            alert(data.error || 'Could not send the message.');
            setMessageText(text);
          } else {
            await loadGlobalMessages();
          }
        } catch (err) {
          setMessageText(text);
        } finally {
          setSending(false);
        }
      };

      const listForChannel = channel === 'assigned' ? assignedChats
        : channel === 'open' ? openChats
        : channel === 'resolved' ? resolvedChats
        : farmerConsultations;

      const openPrivateChat = (item) => {
        onSelectConsultation(item._id || item.id);
        setActiveView('consultation_room');
      };

      return (
        <div className="h-[calc(100vh-4rem)] max-w-7xl mx-auto p-3 sm:p-5">
          <div className={`h-full rounded-3xl border shadow-2xl overflow-hidden flex ${isDark ? 'bg-emerald-950/70 border-emerald-500/30' : 'bg-white/95 border-emerald-200'}`}>
            <aside className={`w-24 sm:w-72 shrink-0 border-r flex flex-col ${isDark ? 'border-emerald-500/20 bg-emerald-950/80' : 'border-slate-200 bg-slate-50'}`}>
              <div className="p-4 sm:p-5 border-b border-emerald-500/20">
                <button
                  onClick={() => setActiveView(isExpert ? 'expert_dashboard' : 'farmer_dashboard')}
                  className="text-[11px] font-bold text-emerald-600 hover:text-emerald-500 mb-3"
                >
                  ← Dashboard
                </button>
                <h1 className="hidden sm:block text-xl font-black">Chat Centre</h1>
                <p className="hidden sm:block text-[11px] opacity-60 mt-1">{isExpert ? 'Expert communication desk' : 'Choose one of your two chat options'}</p>
                <div className="sm:hidden w-8 h-1 rounded-full bg-emerald-600 mx-auto"></div>
              </div>

              <nav className="p-2 sm:p-3 space-y-2 flex-1">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setChannel(item.id)}
                    className={`w-full p-3 rounded-2xl flex flex-col sm:flex-row items-center sm:items-start gap-1 sm:gap-3 text-left transition border ${channel === item.id ? 'bg-emerald-700 text-white border-emerald-600 shadow-lg' : isDark ? 'border-transparent hover:bg-emerald-900/60' : 'border-transparent hover:bg-white hover:border-emerald-200'}`}
                  >
                    <span className="min-w-0 flex-1">
                      <span className="block text-[10px] sm:text-sm font-extrabold text-center sm:text-left leading-tight">{item.label}</span>
                      <span className={`hidden sm:block text-[10px] mt-0.5 ${channel === item.id ? 'text-emerald-100' : 'opacity-55'}`}>{item.sub}</span>
                    </span>
                    {item.count !== null && (
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${channel === item.id ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-800'}`}>{item.count}</span>
                    )}
                  </button>
                ))}
              </nav>

              <div className="hidden sm:block p-4 border-t border-emerald-500/20">
                <div className="flex items-center gap-2">
                  <ProfileAvatar user={currentUser} size="w-9 h-9" />
                  <div className="min-w-0">
                    <p className="text-xs font-extrabold truncate">{currentUser?.name}</p>
                    <p className="text-[10px] opacity-60 capitalize">{currentUser?.role} • Online</p>
                  </div>
                </div>
              </div>
            </aside>

            <section className="flex-1 min-w-0 flex flex-col">
              {channel === 'global' ? (
                <>
                  <div className={`px-4 sm:px-6 py-4 border-b flex items-center justify-between ${isDark ? 'border-emerald-500/20' : 'border-slate-200'}`}>
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="font-black text-base sm:text-xl">GoviSahana Global Community</h2>
                        <span className="text-[10px] font-black px-2 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">GROUP</span>
                      </div>
                      <p className="text-[11px] opacity-60">All farmers and agricultural experts can participate</p>
                    </div>
                    <span className="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-bold text-emerald-600"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live</span>
                  </div>

                  <div className="flex-1 overflow-y-auto chat-scroll p-4 sm:p-6 space-y-4">
                    {loading && globalMessages.length === 0 && <p className="text-center text-xs opacity-60 py-8">Loading community messages...</p>}
                    {globalMessages.map((msg, index) => {
                      const system = msg.senderRole === 'system';
                      const mine = String(msg.senderEmail || '').toLowerCase() === email;
                      if (system) return (
                        <div key={msg._id || msg.id || index} className="text-center">
                          <span className="inline-block max-w-xl px-4 py-2 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[11px] font-bold">{msg.text}</span>
                        </div>
                      );
                      return (
                        <div key={msg._id || msg.id || index} className={`flex items-end gap-2 ${mine ? 'justify-end' : 'justify-start'}`}>
                          {!mine && <ProfileAvatar user={{ name: msg.senderName, profileImage: msg.senderProfileImage }} size="w-8 h-8" textSize="text-[10px]" />}
                          <div className={`max-w-[85%] sm:max-w-xl rounded-2xl px-4 py-3 shadow-sm ${mine ? 'bg-emerald-700 text-white rounded-br-md' : isDark ? 'bg-emerald-900/80 border border-emerald-500/30 rounded-bl-md' : 'bg-slate-100 border border-slate-200 rounded-bl-md'}`}>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[10px] font-black">{msg.senderName}</span>
                              <span className={`text-[9px] uppercase font-black px-1.5 py-0.5 rounded ${msg.senderRole === 'expert' ? 'bg-amber-400/25 text-amber-300' : 'bg-white/15'}`}>{msg.senderRole}</span>
                              <span className="text-[9px] opacity-60">{msg.timestamp}</span>
                            </div>
                            <p className="text-xs sm:text-sm whitespace-pre-wrap leading-relaxed">{msg.text}</p>
                          </div>
                          {mine && <ProfileAvatar user={{ name: msg.senderName, profileImage: msg.senderProfileImage }} size="w-8 h-8" textSize="text-[10px]" />}
                        </div>
                      );
                    })}
                    <div ref={messagesEndRef}></div>
                  </div>

                  <form onSubmit={sendGlobalMessage} className={`p-3 sm:p-4 border-t ${isDark ? 'border-emerald-500/20' : 'border-slate-200'}`}>
                    <div className="max-w-4xl mx-auto flex gap-2">
                      <input
                        value={messageText}
                        onChange={event => setMessageText(event.target.value)}
                        maxLength="2000"
                        placeholder="Write a message to the farming community..."
                        className={`flex-1 px-4 py-3 rounded-2xl border outline-none text-sm focus:ring-2 focus:ring-emerald-500/30 ${isDark ? 'bg-emerald-950 border-emerald-500/30 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                      />
                      <button disabled={sending || !messageText.trim()} className="px-5 sm:px-7 py-3 rounded-2xl bg-emerald-700 hover:bg-emerald-600 text-white font-black text-xs shadow disabled:opacity-50">{sending ? 'Sending...' : 'Send'}</button>
                    </div>
                  </form>
                </>
              ) : (
                <>
                  <div className={`px-4 sm:px-6 py-4 border-b flex items-center justify-between gap-3 ${isDark ? 'border-emerald-500/20' : 'border-slate-200'}`}>
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="font-black text-base sm:text-xl">{navItems.find(item => item.id === channel)?.label}</h2>
                        <span className="text-[10px] font-black px-2 py-1 rounded-full bg-purple-100 text-purple-800 border border-purple-300">PRIVATE</span>
                      </div>
                      <p className="text-[11px] opacity-60">Only the farmer and assigned expert can read and reply</p>
                    </div>
                    {!isExpert && (
                      <button onClick={onOpenNewTicketModal} className="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs shadow">+ Ask a Problem</button>
                    )}
                  </div>

                  <div className="flex-1 overflow-y-auto chat-scroll p-4 sm:p-6">
                    {listForChannel.length === 0 ? (
                      <div className={`max-w-lg mx-auto mt-12 p-8 rounded-3xl text-center border border-dashed ${isDark ? 'border-emerald-500/30 bg-emerald-950/30' : 'border-slate-300 bg-slate-50'}`}>
                        <div className="text-4xl mb-3">{channel === 'open' ? '' : ''}</div>
                        <h3 className="font-black">No chats in this section</h3>
                        <p className="text-xs opacity-60 mt-1">{!isExpert ? 'Ask a farming problem and the best-matched expert will be assigned automatically.' : 'New matching conversations will appear here.'}</p>
                        {!isExpert && <button onClick={onOpenNewTicketModal} className="mt-4 px-5 py-3 rounded-xl bg-emerald-700 text-white font-black text-xs">Ask Your First Problem</button>}
                      </div>
                    ) : (
                      <div className="max-w-4xl mx-auto space-y-3">
                        {listForChannel.map(item => {
                          const id = item._id || item.id;
                          const isOpen = !item.assignedExpertEmail;
                          const isSuggestedToMe = isExpert && isOpen && item.suggestionStatus === 'Pending' && String(item.suggestedExpertEmail || '').toLowerCase() === email;
                          return (
                            <div key={id} className={`p-4 sm:p-5 rounded-2xl border flex flex-col sm:flex-row sm:items-center gap-4 ${isDark ? 'bg-emerald-950/50 border-emerald-500/20' : 'bg-white border-slate-200 shadow-sm'}`}>
                              <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-xl shrink-0">{item.cropType === 'paddy' ? '' : item.cropType === 'coconut' ? '' : ''}</div>
                              <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-2 flex-wrap mb-1">
                                  <span className="text-[10px] font-mono font-bold opacity-60">{item.ticketId}</span>
                                  <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${item.status === 'Resolved' ? 'bg-blue-100 text-blue-800' : isOpen ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>{item.status}</span>
                                  {isSuggestedToMe && <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-purple-100 text-purple-800">SUGGESTED FOR YOU</span>}
                                  {isExpert && isOpen && !isSuggestedToMe && <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">OPEN TO ALL EXPERTS</span>}
                                </div>
                                <h3 className="font-extrabold text-sm sm:text-base truncate">{item.title}</h3>
                                <p className="text-[11px] opacity-60 mt-1 truncate">{isExpert ? `Farmer: ${item.farmerName} • ${item.farmerDistrict}` : item.assignedExpertName ? `Expert: ${item.assignedExpertName}` : item.suggestedExpertName ? `Waiting for ${item.suggestedExpertName} or another expert to accept` : 'Waiting for an expert to accept'}</p>
                              </div>
                              {isExpert && isOpen ? (
                                <div className="flex items-center gap-2">
                                  <button onClick={async () => { const ok = await onClaimTicket(id); if (ok) openPrivateChat(item); }} className="px-4 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs shadow">Accept & Open</button>
                                  {isSuggestedToMe && (
                                    <button onClick={() => onRejectTicket(id)} className="px-4 py-2.5 rounded-xl bg-red-100 hover:bg-red-200 text-red-800 border border-red-300 font-black text-xs">Reject</button>
                                  )}
                                </div>
                              ) : (
                                <button onClick={() => openPrivateChat(item)} className="px-4 py-2.5 rounded-xl bg-emerald-700 text-white font-black text-xs shadow">Open Private Chat →</button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </>
              )}
            </section>
          </div>
        </div>
      );
    }

    // --- USER PROFILE MODAL ---
    function UserProfileModal({ isOpen, onClose, currentUser, onLogout, onUserUpdate }) {
      const [photoLoading, setPhotoLoading] = useState(false);
      const [photoError, setPhotoError] = useState('');
      const photoInputRef = React.useRef(null);

      const saveProfilePhoto = async (profileImage) => {
        setPhotoLoading(true);
        setPhotoError('');
        try {
          const response = await fetch(`${API_BASE}/api/users/profile-photo`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentUser.email, profileImage })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Unable to update profile photo.');
          onUserUpdate(data.user);
        } catch (error) {
          setPhotoError(error.message);
        } finally {
          setPhotoLoading(false);
        }
      };

      const handlePhotoSelection = (event) => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          setPhotoError('Choose a JPEG, PNG, or WebP image.');
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          setPhotoError('Choose an image smaller than 8 MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const size = Math.min(640, Math.max(image.width, image.height));
            const scale = Math.min(1, size / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            saveProfilePhoto(canvas.toDataURL('image/jpeg', 0.86));
          };
          image.onerror = () => setPhotoError('This image could not be read.');
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      };

      if (!isOpen || !currentUser) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn no-print">
          <BentoTiltCard className="w-full max-w-md !p-0 overflow-hidden shadow-2xl">
            <div className="bg-gradient-to-r from-emerald-900 to-emerald-800 p-6 text-white text-center border-b border-emerald-700 relative">
              <button onClick={onClose} aria-label="Close profile" className="absolute top-4 right-4 w-8 h-8 rounded-full bg-emerald-950 text-white font-bold text-sm cursor-pointer">×</button>
              <ProfileAvatar user={currentUser} size="w-20 h-20" textSize="text-2xl" className="mx-auto mb-3 border-2 border-white shadow-lg" />
              <h3 className="text-xl font-black text-white">{currentUser.name}</h3>
              <p className="text-xs text-emerald-200 capitalize font-bold">{currentUser.role} Account • {currentUser.district || 'Sri Lanka'}</p>
              <div className="mt-4 flex items-center justify-center gap-2">
                <input ref={photoInputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={handlePhotoSelection} className="hidden" />
                <button type="button" disabled={photoLoading} onClick={() => photoInputRef.current?.click()} className="px-3 py-2 rounded-lg bg-white text-emerald-900 text-xs font-extrabold hover:bg-emerald-50 disabled:opacity-60">
                  {photoLoading ? 'Saving...' : currentUser.profileImage ? 'Change photo' : 'Add profile photo'}
                </button>
                {currentUser.profileImage && (
                  <button type="button" disabled={photoLoading} onClick={() => saveProfilePhoto('')} className="px-3 py-2 rounded-lg border border-white/40 text-white text-xs font-bold hover:bg-white/10 disabled:opacity-60">Remove</button>
                )}
              </div>
            </div>

            <div className="p-6 space-y-4">
              {photoError && <div className="p-3 rounded-xl border border-red-500/30 bg-red-950/30 text-red-300 text-xs font-semibold">{photoError}</div>}
              <div className="space-y-2 text-xs">
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">Email:</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.email}</span>
                </div>
                {currentUser.phone && (
                  <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                    <span className="opacity-70 font-bold">Mobile Phone:</span>
                    <span className="font-extrabold text-emerald-400">{currentUser.phone}</span>
                  </div>
                )}
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">District / Area:</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.district || 'Anuradhapura'}</span>
                </div>
                <div className="p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 flex justify-between">
                  <span className="opacity-70 font-bold">{currentUser.role === 'farmer' ? 'Primary Crop:' : 'Designation / Specialty:'}</span>
                  <span className="font-extrabold text-emerald-400">{currentUser.cropOrDept || 'General Agronomy'}</span>
                </div>
              </div>

              <button
                onClick={() => { onLogout(); onClose(); }}
                className="w-full py-3 bg-red-900/40 hover:bg-red-900/60 text-red-400 font-extrabold text-xs rounded-xl border border-red-500/30 transition shadow cursor-pointer"
              >
                Log Out of Account
              </button>
            </div>
          </BentoTiltCard>
        </div>
      );
    }

    // --- MAIN APP WITH FULL BACKEND DATABASE SYNCHRONIZATION ---
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('govisahana_active_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [activeView, setActiveView] = useState('landing');
      const [currentLanguage, setCurrentLanguage] = useState('en');
      const [themeMode, setThemeMode] = useState('light');
      const [isProfileOpen, setIsProfileOpen] = useState(false);

      useEffect(() => {
        document.body.className = `${themeMode}-mode lang-${currentLanguage}`;
        document.documentElement.lang = currentLanguage;
      }, [themeMode, currentLanguage]);

      const toggleTheme = () => {
        setThemeMode(prev => prev === 'dark' ? 'light' : 'dark');
      };

      const [consultations, setConsultations] = useState(INITIAL_CONSULTATIONS);
      const [activeConsultationId, setActiveConsultationId] = useState('con_101');
      const [isTicketModalOpen, setIsTicketModalOpen] = useState(false);

      // Fetch live consultations from backend database
      const refreshConsultations = async (userOverride) => {
        try {
          const activeUser = userOverride || currentUser;
          const query = activeUser?.role === 'farmer' && activeUser?.email
            ? `?farmerEmail=${encodeURIComponent(activeUser.email)}`
            : '';
          const res = await fetch(`${API_BASE}/api/consultations${query}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              setConsultations(data);
            }
          }
        } catch (e) {}
      };

      // Poll database for ticket list changes every 4 seconds
      useEffect(() => {
        refreshConsultations();
        const poll = setInterval(refreshConsultations, 4000);
        return () => clearInterval(poll);
      }, [currentUser?.email, currentUser?.role]);

      const handleAuthSuccess = (userObj) => {
        setCurrentUser(userObj);
        try {
          localStorage.setItem('govisahana_active_user', JSON.stringify(userObj));
        } catch (e) {}
        refreshConsultations(userObj);
        setActiveView(userObj && userObj.role === 'expert' ? 'expert_dashboard' : 'farmer_dashboard');
      };

      const handleUserUpdate = (userObj) => {
        setCurrentUser(userObj);
        try {
          localStorage.setItem('govisahana_active_user', JSON.stringify(userObj));
        } catch (e) {}
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('govisahana_active_user');
        } catch (e) {}
        setActiveView('landing');
      };

      // Create new ticket: posts to backend database
      const handleCreateTicket = async (ticketData) => {
        try {
          const payload = {
            ...ticketData,
            farmerName: currentUser?.name || ticketData.farmerName || 'Farmer Member',
            farmerEmail: currentUser?.email || ticketData.farmerEmail || 'sunil@farmer.lk',
            farmerPhone: currentUser?.phone || ticketData.farmerPhone || '+94 77 555 1212',
            farmerDistrict: currentUser?.district || ticketData.farmerDistrict || 'Anuradhapura'
          };
          const res = await fetch(`${API_BASE}/api/consultations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data && data.consultation) {
            const created = data.consultation;
            const cid = created._id || created.id;
            setConsultations(prev => [created, ...prev.filter(c => (c._id || c.id) !== cid)]);
            setActiveConsultationId(cid);
            setActiveView('consultation_room');
            refreshConsultations();
          }
        } catch (err) {
          console.error('Failed to create ticket:', err);
        }
      };

      // Expert claims ticket exclusively
      const handleClaimTicket = async (consultationId) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/claim`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              expertName: currentUser?.name || 'Dr. Nimal Jayasinghe',
              expertEmail: currentUser?.email || 'nimal@govisahana.lk',
              expertId: currentUser?._id || currentUser?.id || 'exp_1'
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to claim consultation');
            return false;
          }
          await refreshConsultations();
          return true;
        } catch (err) {
          console.error('Claim error:', err);
          return false;
        }
      };

      // Suggested expert declines; the backend immediately suggests the next match.
      const handleRejectTicket = async (consultationId) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              expertName: currentUser?.name || 'Agricultural Expert',
              expertEmail: currentUser?.email || ''
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to reject this invitation');
            return false;
          }
          await refreshConsultations();
          return true;
        } catch (err) {
          console.error('Reject invitation error:', err);
          return false;
        }
      };

      // Expert releases ticket
      const handleReleaseTicket = async (consultationId) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/release`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              expertEmail: currentUser?.email || ''
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to release consultation');
            return false;
          }
          await refreshConsultations();
          return true;
        } catch (err) {
          console.error('Release error:', err);
          return false;
        }
      };

      // Send message to backend database
      const handleSendMessage = async (consultationId, msgPayload) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              senderName: currentUser?.name || msgPayload.senderName || 'User',
              senderRole: currentUser?.role || msgPayload.senderRole || 'farmer',
              senderEmail: currentUser?.email || msgPayload.senderEmail || '',
              senderProfileImage: currentUser?.profileImage || '',
              text: msgPayload.text,
              image: msgPayload.image,
              prescription: msgPayload.prescription || null
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to send message');
            return null;
          }
          refreshConsultations();
          return data;
        } catch (err) {
          console.error('Failed to send message:', err);
          return null;
        }
      };

      // Issue prescription to backend database
      const handleIssuePrescription = async (consultationId, rxPayload) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/prescription`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...rxPayload,
              expertName: currentUser?.name || 'Senior Agronomist',
              expertEmail: currentUser?.email || 'nimal@govisahana.lk'
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to issue prescription');
            return false;
          }
          await refreshConsultations();
          return true;
        } catch (err) {
          console.error('Prescription error:', err);
          return false;
        }
      };

      // Mark resolved
      const handleMarkResolved = async (consultationId) => {
        try {
          const res = await fetch(`${API_BASE}/api/consultations/${consultationId}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              expertEmail: currentUser?.email || ''
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Failed to resolve consultation');
            return false;
          }
          await refreshConsultations();
          return true;
        } catch (e) {
          return false;
        }
      };

      // Resolve active consultation by matching _id or id
      const activeConsultation = consultations.find(c => (c._id === activeConsultationId || c.id === activeConsultationId || c.ticketId === activeConsultationId)) || consultations[0];

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar
            activeView={activeView}
            setActiveView={setActiveView}
            currentLanguage={currentLanguage}
            setCurrentLanguage={setCurrentLanguage}
            currentUser={currentUser}
            onLogout={handleLogout}
            onOpenProfile={() => setIsProfileOpen(true)}
            themeMode={themeMode}
            toggleTheme={toggleTheme}
          />

          <main className="flex-1">
            {activeView === 'landing' && <LandingPage setActiveView={setActiveView} currentLanguage={currentLanguage} themeMode={themeMode} />}
            {activeView === 'login' && <SecureLoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />}
            {activeView === 'signup' && <SignupPage setActiveView={setActiveView} onSignupSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />}

            {activeView === 'farmer_dashboard' && (
              currentUser ? (
                <FarmerDashboard
                  currentUser={currentUser}
                  consultations={consultations}
                  onOpenNewTicketModal={() => setIsTicketModalOpen(true)}
                  onSelectConsultation={(id) => setActiveConsultationId(id)}
                  setActiveView={setActiveView}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <SecureLoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {activeView === 'consultation_room' && (
              currentUser ? (
                <ConsultationRoom
                  currentUser={currentUser}
                  consultation={activeConsultation}
                  onSendMessage={handleSendMessage}
                  onClaimTicket={handleClaimTicket}
                  onRejectTicket={handleRejectTicket}
                  onReleaseTicket={handleReleaseTicket}
                  onIssuePrescription={handleIssuePrescription}
                  onMarkResolved={handleMarkResolved}
                  onBackToDashboard={() => setActiveView(currentUser && currentUser.role === 'expert' ? 'expert_dashboard' : 'farmer_dashboard')}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <SecureLoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {activeView === 'chat_hub' && (
              currentUser ? (
                <ChatHub
                  currentUser={currentUser}
                  consultations={consultations}
                  onSelectConsultation={(id) => setActiveConsultationId(id)}
                  onClaimTicket={handleClaimTicket}
                  onRejectTicket={handleRejectTicket}
                  onOpenNewTicketModal={() => setIsTicketModalOpen(true)}
                  setActiveView={setActiveView}
                  themeMode={themeMode}
                />
              ) : (
                <SecureLoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {activeView === 'expert_dashboard' && (
              currentUser ? (
                <ExpertDashboard
                  currentUser={currentUser}
                  consultations={consultations}
                  onSelectConsultation={(id) => setActiveConsultationId(id)}
                  onClaimTicket={handleClaimTicket}
                  onRejectTicket={handleRejectTicket}
                  onReleaseTicket={handleReleaseTicket}
                  setActiveView={setActiveView}
                  currentLanguage={currentLanguage}
                  themeMode={themeMode}
                />
              ) : (
                <SecureLoginPage setActiveView={setActiveView} onLoginSuccess={handleAuthSuccess} currentLanguage={currentLanguage} themeMode={themeMode} />
              )
            )}

            {!['landing', 'login', 'signup', 'farmer_dashboard', 'consultation_room', 'expert_dashboard', 'chat_hub'].includes(activeView) && (
              <LandingPage setActiveView={setActiveView} currentLanguage={currentLanguage} themeMode={themeMode} />
            )}
          </main>

          <NewTicketModal
            isOpen={isTicketModalOpen}
            onClose={() => setIsTicketModalOpen(false)}
            onSubmitTicket={handleCreateTicket}
            currentUser={currentUser}
            currentLanguage={currentLanguage}
            themeMode={themeMode}
          />

          <UserProfileModal
            isOpen={isProfileOpen}
            onClose={() => setIsProfileOpen(false)}
            currentUser={currentUser}
            onUserUpdate={handleUserUpdate}
            onLogout={handleLogout}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
